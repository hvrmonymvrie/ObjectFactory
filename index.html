<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Object Factory</title>
<meta name="description" content="Interactive intro Java lessons, from your first program through classes and objects, with step-through memory diagrams and typing practice.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a factory floor. Header HUD, then a floor plan of stations; each station is a single column of steps
   where blueprints are blue, products (objects) are orange, and safety yellow marks what you act on. */
:root{
  --bg:#ECEEEA; --surface:#FFFFFF; --surface-2:#F4F5F2; --ink:#1C2228; --muted:#56616B; --line:#D2D7D5;
  --blueprint:#1E4F8F; --blueprint-ink:#FFFFFF; --bp-grid:rgba(255,255,255,.13); --blueprint-soft:#E1E9F4;
  --safety:#F2B705; --safety-ink:#1C2228;
  --product:#BF4A1B; --product-soft:#FBE8DD;
  --good:#1F7444; --good-soft:#DCF0E3; --bad:#B42318; --bad-soft:#FBE3E0;
  --code-bg:#1E242A; --code-ink:#E4E8EB; --code-dim:#8C97A1; --code-kw:#F2B705; --code-str:#A6DCA0; --code-num:#F5A887; --code-type:#93BDF7; --code-hl:rgba(242,183,5,.17);
  --display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12161A; --surface:#1A1F25; --surface-2:#212830; --ink:#E6E9EB; --muted:#9BA6B0; --line:#2E3740;
  --blueprint:#2B5E9F; --blueprint-ink:#FFFFFF; --bp-grid:rgba(255,255,255,.10); --blueprint-soft:#1D2B3E;
  --safety:#F5C333; --safety-ink:#15191D;
  --product:#F08049; --product-soft:#3A2418;
  --good:#5BCB8B; --good-soft:#163427; --bad:#FF8C7C; --bad-soft:#3D201D;
  --code-bg:#0D1013; --code-ink:#E4E8EB; --code-dim:#7D8892; --code-kw:#F5C333; --code-str:#A6DCA0; --code-num:#F5A887; --code-type:#93BDF7; --code-hl:rgba(245,195,51,.14);
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#12161A; --surface:#1A1F25; --surface-2:#212830; --ink:#E6E9EB; --muted:#9BA6B0; --line:#2E3740;
  --blueprint:#2B5E9F; --blueprint-ink:#FFFFFF; --bp-grid:rgba(255,255,255,.10); --blueprint-soft:#1D2B3E;
  --safety:#F5C333; --safety-ink:#15191D;
  --product:#F08049; --product-soft:#3A2418;
  --good:#5BCB8B; --good-soft:#163427; --bad:#FF8C7C; --bad-soft:#3D201D;
  --code-bg:#0D1013; --code-ink:#E4E8EB; --code-dim:#7D8892; --code-kw:#F5C333; --code-str:#A6DCA0; --code-num:#F5A887; --code-type:#93BDF7; --code-hl:rgba(245,195,51,.14);
  color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
/* no ligatures: learners must see >= and != exactly as they type them */
code,.mono,.codeblock,.piece,.pline,.inp,.pattern,.cell,.obj,.bp,.btn-m,.prod-in,.diamond,.exit,.vbox,.tiles,.sheet,.lapv,.nest,.chip,.console,.edges{font-variant-ligatures:none;font-feature-settings:"calt" 0,"liga" 0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:880px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.05;text-wrap:balance;margin:0;letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,.navlink:focus-visible{outline:3px solid var(--safety);outline-offset:2px}
code,.mono{font-family:var(--mono);font-size:.88em}
p{margin:0}
.key{font-weight:700;background:linear-gradient(transparent 62%,color-mix(in srgb,var(--safety) 55%,transparent) 62%);padding:0 .1em}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;margin-bottom:24px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.brand-mark{width:30px;height:30px;flex:none}
.brand-name{font-family:var(--display);font-weight:900;font-size:24px;letter-spacing:.04em;text-transform:uppercase}
.hud{margin-left:auto;display:flex;gap:6px}
.hud span{display:flex;align-items:baseline;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.hud b{font-size:16px}
.hud small{color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:11px}

/* home */
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.hero{display:grid;gap:10px;margin-bottom:28px}
.hero h1{font-size:clamp(44px,9vw,76px);text-transform:uppercase}
.hero p{max-width:60ch;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.floor{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.st{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;display:grid;gap:6px;align-content:start;min-width:0}
.st:not([disabled]):hover{border-color:var(--ink)}
.st[disabled]{cursor:default;background:var(--surface-2)}
.st-num{font-family:var(--display);font-weight:900;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.st-name{font-weight:700;font-size:18px;line-height:1.25}
.st-nick{font-size:14px;color:var(--muted)}
.st-foot{display:flex;align-items:center;gap:8px;margin-top:6px}
.pill{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 10px;white-space:nowrap}
.pill.open{background:var(--safety);color:var(--safety-ink)}
.pill.done{background:var(--good-soft);color:var(--good)}
.pill.soon{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.bar{flex:1;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--good)}
.hazard{background:repeating-linear-gradient(-45deg,var(--safety) 0 10px,var(--safety-ink) 10px 20px);height:6px;border-radius:3px}
.st .hazard{position:absolute;inset:0 0 auto;border-radius:var(--r) var(--r) 0 0}
.flag{font-size:13px;color:var(--ink);background:color-mix(in srgb,var(--safety) 22%,var(--surface));border-radius:6px;padding:4px 8px}
.vbox{border:2px solid var(--blueprint);border-radius:8px;background:var(--surface);text-align:center;min-width:84px;overflow:hidden;font-family:var(--mono)}
.vbox small{display:block;background:var(--blueprint-soft);font-size:12px;padding:2px 8px}
.vbox b{display:block;padding:6px 10px;font-size:18px;font-weight:600}
.vbox.hot b{background:color-mix(in srgb,var(--safety) 40%,transparent)}
.vbox.gone{opacity:.4;text-decoration:line-through}
.tiles{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.tiles span{display:grid;text-align:center;min-width:26px}
.tiles b{font-family:var(--mono);font-weight:600;border:1.5px solid var(--line);background:var(--surface);border-radius:5px;padding:3px 6px;font-size:16px}
.tiles small{font-size:11px;color:var(--muted);font-family:var(--mono)}
.tiles .hot b{background:var(--safety);color:var(--safety-ink);border-color:var(--safety)}
.crates{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:flex-end;max-width:220px}
.crate{border:2px solid var(--product);border-radius:6px;padding:4px;display:flex;flex-wrap:wrap;gap:3px;background:var(--product-soft);max-width:60px}
.crate.left{border-style:dashed;background:transparent}
.dotp{display:block;width:11px;height:11px;border-radius:50%;background:var(--product)}
.gatev{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.diamond{font-family:var(--mono);font-size:14px;border:2px solid var(--safety);background:color-mix(in srgb,var(--safety) 15%,var(--surface));padding:8px 12px;border-radius:8px}
.exits{display:grid;gap:6px;font-size:14px}
.exit{border:1.5px solid var(--line);border-radius:6px;padding:3px 8px;background:var(--surface)}
.exit.on{border-color:var(--good);background:var(--good-soft)}
.exit.off{opacity:.45}
.lapv{display:flex;align-items:center;gap:8px;color:var(--product)}
.lapv svg{width:54px;height:54px;flex:none}
.lapv b{display:block;font-family:var(--mono);color:var(--ink);font-size:14px}
.lapv small{display:block;color:var(--muted);font-size:12px}
.nest{border:2px solid var(--product);border-radius:10px;padding:6px 8px 8px;background:var(--surface);display:grid;gap:6px;font-family:var(--mono);font-size:13px;min-width:0;text-align:left}
.nest .nest{background:var(--surface-2)}
.nest.base{border-color:var(--good);background:var(--good-soft)}
.nest-out{font-family:var(--body);font-size:12px;color:var(--good);font-weight:700}
.sheet{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--blueprint);border-radius:6px;padding:8px 12px;font-family:var(--mono);font-size:13px;display:grid;gap:2px;min-width:0;overflow-x:auto;white-space:pre}
.sheet i{font-style:normal;color:var(--muted);display:inline-block;width:1.6em}
.strip + .codeblock{margin-top:12px}
.cell.noaddr{grid-template-columns:minmax(0,1fr) auto}
.part-h{font-size:28px;text-transform:uppercase;margin:26px 0 12px}
.note-foot{margin-top:28px;font-size:14px;color:var(--muted);max-width:62ch}

/* station */
.st-head{display:grid;gap:8px;margin-bottom:14px}
.st-head h1{font-size:clamp(34px,6.5vw,52px)}
.back{background:none;border:0;padding:0;color:var(--muted);font-size:15px;justify-self:start}
.back:hover{color:var(--ink)}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 18px}
.dot{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.dot.done{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.dot.cur{background:var(--safety);border-color:var(--safety);color:var(--safety-ink)}
.dot[disabled]{opacity:.45;cursor:default}
.step{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px clamp(16px,3vw,28px);display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.step > *,.trace > *,.task-body,.sub{min-width:0}
.step-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.lvl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:6px;padding:2px 8px;border:1px solid currentColor}
.lvl.guided{color:var(--blueprint)} .lvl.faded{color:var(--product)} .lvl.solo{color:var(--ink)} .lvl.review{color:var(--good)}
:root[data-theme="dark"] .lvl.guided{color:var(--code-type)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .lvl.guided{color:var(--code-type)} }
.step h2{font-size:clamp(28px,5vw,38px);margin-top:6px}
.explain{display:grid;gap:10px;max-width:66ch}
.explain ol.steps{margin:0;padding-left:1.4em;display:grid;gap:4px}
.words{display:flex;flex-wrap:wrap;gap:8px}
.word{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:4px 10px;font-size:15px;text-align:left}
.word b{font-weight:700}
.word span{display:none;color:var(--muted)}
.word[aria-expanded="true"]{border-color:var(--ink)}
.word[aria-expanded="true"] span{display:inline}
.rem{border-left:5px solid var(--good);background:var(--good-soft);padding:10px 14px;border-radius:0 8px 8px 0;max-width:66ch}
.rem b{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--good)}
.cap{font-size:14px;color:var(--muted);text-align:center}

/* task */
.task{border-top:2px dashed var(--line);padding-top:18px;display:grid;gap:12px}
.task-h{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.q{font-weight:700;font-size:18px;max-width:64ch}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--surface-2);border:1.5px solid var(--line);border-radius:9px;padding:10px 14px;min-width:0;overflow-wrap:anywhere}
.opt:not([disabled]):hover{border-color:var(--ink)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:.85;cursor:default}
.opt code{font-size:15px}
.fb{border-radius:9px;padding:10px 14px;display:none;max-width:66ch}
.fb.good{display:block;background:var(--good-soft);border:1px solid var(--good)}
.fb.bad{display:block;background:var(--bad-soft);border:1px solid var(--bad)}
.fb.info{display:block;background:var(--surface-2);border:1px solid var(--line)}
.fb strong{display:block}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inp{font:inherit;font-family:var(--mono);font-size:16px;padding:9px 12px;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);min-width:0;flex:1 1 180px;max-width:320px}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:9px;padding:9px 18px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.go{background:var(--safety);border-color:var(--safety);color:var(--safety-ink)}
.btn[disabled]{opacity:.4;cursor:default}
.step-foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.step-foot .btn.go{margin-left:auto}
.hintbox{display:grid;gap:6px}
.hint{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:15px}
.worked{background:var(--blueprint-soft);border:1px solid var(--blueprint);border-radius:8px;padding:10px 14px}

/* sort */
.sort{display:grid;gap:8px}
.sitem{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px}
.sitem > span{flex:1 1 200px;min-width:0}
.sitem .row button{border:1.5px solid var(--line);background:var(--surface);border-radius:7px;padding:4px 12px;font-size:14px;font-weight:700}
.sitem.ok{border-color:var(--good);background:var(--good-soft)}
.sitem.ok .row button{display:none}
.sitem .tag{font-size:13px;font-weight:700;color:var(--good);display:none}
.sitem.ok .tag{display:inline}
.sitem .why{flex-basis:100%;font-size:14px;color:var(--bad);display:none}
.sitem.miss .why{display:block}

/* code */
.codeblock{background:var(--code-bg);color:var(--code-ink);border-radius:10px;padding:12px 0;overflow-x:auto;font-family:var(--mono);font-size:14.5px;line-height:1.7}
.codeblock .ln{display:flex;padding:0 14px;white-space:pre;min-width:max-content}
.codeblock .ln i{font-style:normal;color:var(--code-dim);width:2.2em;flex:none;user-select:none}
.t-kw{color:var(--code-kw)} .t-str{color:var(--code-str)} .t-num{color:var(--code-num)} .t-type{color:var(--code-type)} .t-com{color:var(--code-dim);font-style:italic}
.pick .ln{cursor:pointer;border:0;background:none;width:100%;text-align:left;font:inherit;color:inherit;border-left:4px solid transparent}
.pick .ln:hover{background:rgba(255,255,255,.05)}
.pick .ln.sel{background:var(--code-hl);border-left-color:var(--code-kw)}
.pick .ln.right{background:rgba(91,203,139,.18);border-left-color:#5BCB8B}
.pick .ln.wrong{background:rgba(255,140,124,.16);border-left-color:#FF8C7C}

/* order (Parsons) */
.parsons{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.parsons > div{min-width:0}
.plist{display:grid;gap:6px;min-height:120px;align-content:start;background:var(--surface-2);border:1.5px dashed var(--line);border-radius:10px;padding:8px}
.plist.ans{border-style:solid;border-color:var(--ink)}
.pline{text-align:left;background:var(--code-bg);color:var(--code-ink);border:0;border-radius:7px;padding:8px 12px;font-family:var(--mono);font-size:14px;overflow-wrap:anywhere}
.pline:hover{outline:2px solid var(--safety)}
.plabel{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:6px}
.plist .empty{font-size:14px;color:var(--muted);padding:6px}

/* visuals: blueprint and products */
.vis{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:18px}
.bp{background-color:var(--blueprint);color:var(--blueprint-ink);border-radius:8px;padding:12px 16px;min-width:0;
  background-image:linear-gradient(var(--bp-grid) 1px,transparent 1px),linear-gradient(90deg,var(--bp-grid) 1px,transparent 1px);background-size:14px 14px;font-family:var(--mono);font-size:14px}
.bp-h{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,.4);padding-bottom:4px;margin-bottom:6px}
.bp-tag{font-family:var(--body);font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.bp ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.prod{background:var(--surface);border:2px solid var(--product);border-radius:10px;min-width:150px;overflow:hidden}
.prod-h{background:var(--product);color:var(--surface);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px}
.prod-in{padding:8px 10px;display:grid;gap:2px;font-family:var(--mono);font-size:14px;border-bottom:1px dashed var(--product)}
.prod-in.sealed{background:repeating-linear-gradient(45deg,var(--product-soft) 0 6px,var(--surface) 6px 12px);color:var(--muted);font-family:var(--body);text-align:center;font-size:13px}
.prod-panel{padding:8px 10px;display:flex;flex-wrap:wrap;gap:5px}
.btn-m{font-family:var(--mono);font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:2px 7px}
.arrow-r{font-family:var(--display);font-size:30px;color:var(--muted)}
.minilabel{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:center;margin-bottom:4px}

/* trace + memory */
.trace{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:14px;align-items:start}
.trace .codeblock .ln.next{background:var(--code-hl);box-shadow:inset 4px 0 var(--code-kw)}
.trace .codeblock .ln.ran{opacity:.6}
.trace .codeblock .ln.ran.last{opacity:1}
.mem{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:22px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px}
.mem-h{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:6px}
.mcol{display:grid;gap:6px;align-content:start;min-width:0;position:relative;z-index:1}
.cell{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-family:var(--mono);font-size:13.5px}
.cell .addr,.obj-h .addr{color:var(--muted);font-size:11.5px}
.cell .nm{overflow-wrap:anywhere}
.cell .nm small{display:block;color:var(--muted);font-size:11px;font-family:var(--body)}
.cell .val{font-weight:600;border:1px solid var(--line);border-radius:4px;padding:1px 7px;background:var(--surface-2);min-width:2.4em;text-align:center}
.cell.ref .val{border-color:var(--product);color:var(--product)}
.obj{background:var(--surface);border:2px solid var(--product);border-radius:8px;overflow:hidden;font-family:var(--mono);font-size:13.5px}

const KEEP = new Set(['public', 'private', 'void', 'int', 'double', 'String', 'boolean', 'char', 'return', 'this', 'new', 'class', 'System', 'out', 'println', 'print', 'if', 'else', 'for', 'while', 'scnr']);
function autoGhost(a) {
  const t = tok(a).map(x => KEEP.has(x) || !/^[\w"']/.test(x) ? x : '_'.repeat(Math.max(3, Math.min(x.length, 8))));
  /* rejoin with Java-style spacing: no space around . ( ) ; , and ++, spaces around other operators */
  let out = '';
  t.forEach((x, k) => {
    const p = t[k - 1];
    if (x === '+' && p === '+' && /\w/.test(t[k - 2] || '')) { out += '+'; return; }
    if (x === '+' && t[k + 1] === '+' && /\w/.test(p || '') && !/[;)]/.test(t[k + 2] || '') === false) { out += '+'; return; }
    if (p === '-' && ['=', '(', ','].includes(t[k - 2])) { out += x; return; }
    const tight = k === 0 || ['.', '(', ')', ';', ','].includes(x) && x !== '(' || x === '(' && /\w$/.test(p) && !['if', 'for', 'while'].includes(p) || p === '.' || p === '(';
    out += (tight ? '' : ' ') + x;
  });
  return out.replace(/;(?=\S)/g, '; ').replace(/,(?=\S)/g, ', ');
}

/* basics visuals: a variable is a labeled box, text is a row of numbered tiles, decisions are gates */
const vbox = (name, val, type = 'int', hot) => `<div class="vbox ${hot ? 'hot' : ''}"><small>${esc(type)} ${esc(name)}</small><b>${esc(val)}</b></div>`;
const outBox = text => `<div class="console" style="margin:0;min-width:120px">${esc(text)}</div>`;
const tiles = (str, hot = []) => `<div class="tiles" aria-label="${esc(str)}">${[...str].map((ch, i) => `<span class="${hot.includes(i) ? 'hot' : ''}"><b>${ch === ' ' ? '&nbsp;' : esc(ch)}</b><small>${i}</small></span>`).join('')}</div>`;
const crates = (n, size) => { const full = Math.floor(n / size), left = n % size, dots = k => '<i class="dotp"></i>'.repeat(k);
  return `<div class="crates" aria-label="${n} items in crates of ${size}">${Array.from({ length: full }, () => `<span class="crate">${dots(size)}</span>`).join('')}${left ? `<span class="crate left">${dots(left)}</span>` : ''}</div>`; };
const gate = (cond, yes, no, on) => `<div class="gatev"><div class="diamond">${esc(cond)}</div><div class="exits"><span class="exit ${on === true ? 'on' : on === false ? 'off' : ''}">true → ${yes}</span><span class="exit ${on === false ? 'on' : on === true ? 'off' : ''}">false → ${no}</span></div></div>`;
const lapv = (label, sub = '') => `<div class="lapv"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 12 A38 38 0 1 1 15 35" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/><path d="M3 30 L16 38 L24 25" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg><div><b>${esc(label)}</b><small>${esc(sub)}</small></div></div>`;
const nest = (labels, last = '', noBase) => labels.reduceRight((inner, l, i) => `<div class="nest ${i === labels.length - 1 && !noBase ? 'base' : ''}"><span>${esc(l)}</span>${inner}</div>`, last ? `<span class="nest-out">${esc(last)}</span>` : '');
const sheet = lines => `<div class="sheet">${lines.map((l, i) => `<div><i>${i + 1}</i>${hl(l)}</div>`).join('')}</div>`;
const stamp = (t, bad) => `<span class="stamp ${bad ? 'bad' : ''}">${esc(t)}</span>`;
const pv = (title, scene, text) => `<div class="panel"><div class="pn">${title}</div><div class="scene">${scene}</div><p>${text}</p></div>`;
const strip = (label, ...panels) => `<div class="strip" aria-label="${esc(label)}">${panels.join('')}</div>`;

{ id: 'vars', part: 1, n: 2, name: 'Variables and assignments', nick: 'The Storage Shelf', blurb: 'Store values in variables, do arithmetic, divide whole numbers, constants, and converting types.',
  steps: [
  { t: 'Warm-up from Station 1', level: 'review',
    task: { kind: 'quiz', qs: [
      { kind: 'type', p: 'Type main’s header.', a: ['public static void main(String[] args) {'] },
      { kind: 'type', p: 'Type a statement that shows Start and ends the line.', a: ['System.out.println("Start");'] },
      { kind: 'choice', q: 'A missing semicolon causes which kind of error?', opts: [{ h: 'Syntax error', ok: true, why: 'The compiler catches it.' }, { h: 'Runtime error', why: 'The program never gets to run.' }, { h: 'Logic error', why: 'The program never gets to run.' }] }] } },

  { t: 'Storing a value', level: 'guided',
    v: () => strip('Declaring and assigning a variable',
      pv('1 · Make a box', vbox('count', '?'), '<code>int count;</code> makes an empty box named count. <code>int</code> means it holds a whole number.'),
      pv('2 · Put a value in', vbox('count', '5', 'int', true), '<code>count = 5;</code> puts 5 into the box.'),
      pv('3 · Put a new value in', vbox('count', '8', 'int', true), '<code>count = 8;</code> takes out the old value and puts 8 in. A box holds one value at a time.')),
    x: `<p>A <span class="key">value</span> is a piece of data, like the number 5. Programs need somewhere to keep values, so they use variables.</p>
      <p>A <span class="key">variable</span> is a named box in the computer's memory. Every variable has a <span class="key">type</span>, which says what kind of value fits in the box. The type <code>int</code> (short for integer) holds whole numbers like 5, 0, or -3.</p>
      <p>Making a variable is called <span class="key">declaring</span> it: the type, then the name, then <code>;</code>. Putting a value in is called <span class="key">assigning</span> it, using <code>=</code>. You can do both in one line: <code>int count = 5;</code></p>`,
    words: [['variable', 'a named box in memory that holds one value'], ['type', 'what kind of value a variable holds'], ['int', 'the type for whole numbers'], ['declare', 'make a variable: type, then name'], ['assign', 'put a value in a variable with =']],
    rem: 'int count = 5; makes a box and fills it. A new assignment replaces the old value.',
    task: { kind: 'input', q: 'What is in <code>pens</code> after these two lines run?', code: ['int pens = 3;', 'pens = 7;'], ok: isNum(7), a: '7', errs: [[isNum(3), 'The second line puts a new value in the box.'], [isNum(10), 'Assigning replaces the value. It doesn’t add.']], miss: 'What did the last line put in the box?', hints: ['A box holds one value at a time.'], worked: '7. The second line replaced the 3.' } },

  { t: 'Copying from one variable to another', level: 'guided',
    v: () => strip('What happens with int boxes = count;',
      pv('1 · Start', vbox('count', '8'), 'count holds 8.'),
      pv('2 · Copy', `<div style="display:grid;gap:6px">${vbox('count', '8')}${vbox('boxes', '8', 'int', true)}</div>`, '<code>int boxes = count;</code> makes a new box and copies the value from count into it.'),
      pv('3 · Two separate boxes', `<div style="display:grid;gap:6px">${vbox('count', '2', 'int', true)}${vbox('boxes', '?', 'int')}</div>`, 'Now there are two boxes. Each one keeps its own value. What happens to boxes when count changes? Run the code to find out.')),
    x: `<p>When a variable's name appears on the right side of <code>=</code>, Java looks inside that box and uses the value it finds there.</p>
      <p>Below, the code is on the left. On the right is a picture of memory: one row per variable, showing its name, its type, and the value inside. Press <b>Run line</b> to run one line at a time and watch the boxes change. A yellow box will ask you to predict before some lines.</p>`,
    trace: { prim: true, code: ['int count = 5;', 'count = 8;', 'int boxes = count;', 'count = 2;', 'System.out.println(boxes);'], steps: [
      { at: 0, run: m => M.decl(m, 'int', 'count', 5, false), note: 'A box named count, holding 5.' },
      { at: 1, run: m => M.set(m, 'count', 8), note: 'The 5 is replaced by 8.' },
      { at: 2, run: m => M.decl(m, 'int', 'boxes', 8, false), note: 'A second box, boxes. Java copied the value it found in count.' },
      { at: 3, run: m => M.set(m, 'count', 2),
        predict: { q: 'After this line puts 2 in count, what will boxes hold?', opts: [{ h: '8', ok: true, why: 'boxes has its own copy. Only count’s box is changed by this line.' }, { h: '2', why: 'This line only changes count’s box. Watch the memory picture.' }] }, note: 'Only count changed. boxes kept its own copy.' },
      { at: 4, run: m => M.print(m, '8'), note: 'println shows the value inside boxes.' }] },
    words: [['memory', 'where a running program keeps its variables']],
    rem: 'b = a; copies the value. After that, a and b are separate boxes.',
    task: { kind: 'input', q: 'What does this show?', code: ['int a = 4;', 'int b = a;', 'a = 10;', 'System.out.println(b);'], ok: isNum(4), a: '4', errs: [[isNum(10), 'Line 3 changes a’s box. Which box is printed?']], miss: 'What was copied into b, and when?', hints: ['Draw two boxes and update them line by line.'], worked: 'b got a copy of 4 on line 2, so it shows 4.' } },

  { t: 'How = works', level: 'guided',
    v: () => strip('How count = count + 1 runs',
      pv('1 · Right side first', vbox('count', '5'), 'Java works out <code>count + 1</code> first, using the 5 in the box.'),
      pv('2 · Then store', vbox('count', '?', 'int', true), 'Then it puts the result into the box named on the left.'),
      pv('3 · Left side is a box', `<code class="mono">5 = count;</code>`, 'The left side must be a variable, so this line is a syntax error.')),
    x: `<p>In math, <code>=</code> means "is equal to." In Java, <code>=</code> is the <span class="key">assignment operator</span>, and it means "work out the right side, then store the result in the variable on the left." An <span class="key">operator</span> is a symbol that does something, like <code>+</code> or <code>=</code>.</p>
      <p>That's why a line like <code>count = count + 1;</code> makes sense in Java, even though it would be impossible in math.</p>`,
    words: [['operator', 'a symbol that does something, like + or ='], ['assignment operator', '= : work out the right side, then store it on the left']],
    rem: 'Right side first, then store the result on the left.',
    task: { kind: 'input', q: 'What does this show?', code: ['int total = 3;', 'total = total + 4;', 'total = total * 2;', 'System.out.println(total);'], ok: isNum(14), a: '14', errs: [[isNum(7), 'That is the value after line 2. Keep going.'], [isNum(11), 'Run the lines in order, one at a time.']], miss: 'Work line by line and update the box each time.', hints: ['In Java, * means multiply.'], worked: '3, then 3 + 4 = 7, then 7 * 2 = 14.' } },

  { t: 'Naming variables', level: 'guided',
    v: () => strip('Rules for names',
      pv('1 · Allowed', `<span class="chip nm">numBoxes</span><span class="chip nm">total2</span>`, 'Letters, digits, and the underscore _ . The first character can’t be a digit.'),
      pv('2 · Not allowed', `<span class="chip">2ndBox</span><span class="chip">my box</span><span class="chip">class</span>`, 'Leading digit, a space, or a word Java already uses.'),
      pv('3 · Good style', `<span class="chip nm">boxesPerCrate</span>`, 'Start lowercase, then capitalize each new word. Choose a name that says what the value means.')),
    x: `<p>A name you make up is called an <span class="key">identifier</span>. Java is case-sensitive, so <code>total</code> and <code>Total</code> would be two different variables. Words Java already uses, like <code>int</code> and <code>class</code>, are <span class="key">reserved words</span> and can't be names.</p>`,
    words: [['identifier', 'a name you choose'], ['reserved word', 'a word Java already uses, so it can’t be a name'], ['camel case', 'lowercase first, then a capital for each new word']],
    rem: 'Letters, digits, _ ; no leading digit, no spaces, no reserved words.',
    task: { kind: 'sort', q: 'Is each one allowed as a variable name?', cats: ['Allowed', 'Not allowed'], doneMsg: 'Check the first character, look for spaces, and watch for reserved words.',
      items: [
        { h: '<code>totalCost</code>', cat: 0, why: 'Check each rule: first character, spaces, reserved words.' },
        { h: '<code>2ndPlace</code>', cat: 1, why: 'Look at the first character.' },
        { h: '<code>my score</code>', cat: 1, why: 'Look between the words.' },
        { h: '<code>_count</code>', cat: 0, why: 'The underscore is one of the allowed characters.' },
        { h: '<code>double</code>', cat: 1, why: 'Is this a word Java already uses for a type?' },
        { h: '<code>item3</code>', cat: 0, why: 'Digits are allowed after the first character.' }],
      hints: ['Check the first character, spaces, and reserved words.'], worked: 'Allowed: totalCost, _count, item3. Not allowed: 2ndPlace, my score, double.' } },

  { t: 'Whole numbers and decimals', level: 'guided',
    v: () => strip('int and double',
      pv('1 · int', vbox('boxes', '12'), 'Whole numbers only.'),
      pv('2 · double', vbox('weight', '4.75', 'double'), 'Numbers with a decimal point.'),
      pv('3 · Mixing them', `<code class="mono">3 * 1.5</code>`, 'If either number is a double, the result is a double.')),
    x: `<p><code>int</code> holds whole numbers. <code>double</code> holds numbers with a decimal point, like 4.75 or 2.0. A number typed straight into code, like <code>12</code> or <code>4.75</code>, is called a <span class="key">literal</span>.</p>
      <p>Very large or very small doubles can use <span class="key">scientific notation</span>: <code>6.02e23</code> means 6.02 × 10<sup>23</sup>.</p>`,
    words: [['double', 'the type for numbers with a decimal point'], ['literal', 'a value typed straight into the code']],
    rem: 'int for whole numbers, double for decimals. int with double gives a double.',
    task: { kind: 'sort', q: 'Which type fits each value best?', cats: ['int', 'double'], doneMsg: 'Ask whether the value can have a decimal part.',
      items: [

        { h: 'Floors in a building', cat: 0, why: 'Can you have part of a floor?' }],

  { t: 'Arithmetic order', level: 'faded',
    v: () => strip('Operator precedence',
      pv('1 · Parentheses first', `<code class="mono">( )</code>`, 'Anything inside parentheses is worked out first.'),
      pv('2 · Then * / %', `<code class="mono">*  /  %</code>`, 'Multiply, divide, and remainder come next.'),
      pv('3 · Then + -', `<code class="mono">+  -</code>`, 'Add and subtract last. Same level? Go left to right.')),
    x: `<p>Java's math symbols: <code>+</code> add, <code>-</code> subtract, <code>*</code> multiply, <code>/</code> divide, and <code>%</code> remainder (next step). The order Java applies them is called <span class="key">precedence</span>. When in doubt, add parentheses to make your meaning clear.</p>`,
    words: [['precedence', 'the order Java applies operators']],
    rem: '( ) first, then * / %, then + -, left to right.',
    task: { kind: 'quiz', qs: [
      { kind: 'input', q: 'What is <code>2 + 3 * 4</code>?', ok: isNum(14), a: '14', errs: [[isNum(20), 'Check which operator comes first.']], miss: 'Which operator goes first?' },
      { kind: 'input', q: 'What is <code>(10 - 4) / 2</code>?', ok: isNum(3), a: '3', errs: [[isNum(8), 'What goes first when there are parentheses?']], miss: 'Parentheses first.' },
      { kind: 'input', q: 'What is <code>20 - 6 - 4</code>?', ok: isNum(10), a: '10', errs: [[isNum(18), 'Same level: go left to right.']], miss: 'Left to right.' }] } },

  { t: 'Dividing whole numbers', level: 'guided',
    v: () => strip('Packing 7 items into crates of 2',
      pv('1 · 7 / 2', crates(7, 2), 'Full crates: 3. When both numbers are ints, <code>/</code> gives only the whole part.'),
      pv('2 · 7 % 2', crates(7, 2), 'Left over: 1. <code>%</code> gives the remainder.'),
      pv('3 · 7.0 / 2', `<code class="mono">3.5</code>`, 'If either number is a double, <code>/</code> gives the full answer.')),
    x: `<p>When both numbers are ints, <code>/</code> drops everything after the decimal point. That's called <span class="key">integer division</span>. The <span class="key">modulo</span> operator <code>%</code> gives what's left over after dividing.</p><p>Dividing an int by 0 crashes the program (a runtime error).</p>`,
    words: [['integer division', 'int / int keeps only the whole part'], ['modulo', '% gives the remainder']],
    rem: 'int / int keeps only the whole part. % gives the remainder. A double on either side gives the full answer.',
    task: { kind: 'quiz', qs: [
      { kind: 'input', q: 'What is <code>17 / 5</code>?', ok: isNum(3), a: '3', errs: [[v => norm(v) === '3.4', 'Are both numbers ints?'], [isNum(2), 'That is what % would give.']], miss: 'How many full crates of 5?' },
      { kind: 'input', q: 'What is <code>17 % 5</code>?', ok: isNum(2), a: '2', errs: [[isNum(3), 'That is what / gives.']], miss: 'How many are left after the full crates?' },
      { kind: 'input', q: 'What is <code>12 % 4</code>?', ok: isNum(0), a: '0', errs: [[isNum(3), 'That is what / gives.']], miss: 'Any left over?' },
      { kind: 'choice', q: 'What is <code>9 / 2.0</code>?', opts: [{ h: '4' , why: 'Is 2.0 an int?' }, { h: '4.5', ok: true, why: '2.0 is a double, so the full answer is kept.' }, { h: '1', why: 'That is 9 % 2.' }] }] } },

  { t: 'Constants with final', level: 'faded',
    v: () => strip('A constant',
      pv('1 · Declare it', vbox('TAX_RATE', '0.07', 'final double'), '<code>final</code> locks the box after its first value.'),
      pv('2 · Use it', `<code class="mono">tax = price * TAX_RATE;</code>`, 'Read it as often as you like.'),
      pv('3 · Try to change it', stamp('Rejected', true), '<code>TAX_RATE = 0.08;</code> won’t compile.')),
    x: `<p>A <span class="key">constant</span> is a variable whose value can't change after it's set. You make one by putting <code>final</code> in front. By convention, constant names are ALL CAPS with <code>_</code> between words.</p>`,
    words: [['constant', 'a variable that can’t change'], ['final', 'the word that makes a variable a constant']],
    rem: 'final double TAX_RATE = 0.07; Constant names are ALL_CAPS.',
    task: { kind: 'bug', code: ['final int MAX_BOXES = 50;', 'int boxes = 20;', 'boxes = boxes + 5;', 'MAX_BOXES = 60;'], line: 3,

  { t: 'Converting between types', level: 'faded',
    v: () => strip('Type conversions',
      pv('1 · int into double', `<code class="mono">double d = 7;</code>`, 'Allowed. Java turns 7 into 7.0 for you.'),
      pv('2 · double into int', `<code class="mono">int n = 3.9;</code>`, 'Won’t compile: the decimal part would be lost, so Java makes you ask for it.'),
      pv('3 · A cast', `<code class="mono">(int) 3.9</code>`, 'Putting a type in parentheses converts the value. Converting to int cuts off the decimal part. It does not round.')),
    x: `<p>A <span class="key">type cast</span> converts a value to another type: <code>(int) 3.9</code> or <code>(double) total</code>. A common use is getting a real average from int totals, like <code>(double) points / games</code>. The cast happens first, so the division uses a double.</p>`,

    rem: 'int → double happens on its own. double → int needs a cast, which cuts off (does not round).',
    task: { kind: 'quiz', qs: [
      { kind: 'input', q: 'What is <code>(int) 8.99</code>?', ok: isNum(8), a: '8', errs: [[isNum(9), 'Does a cast round?']], miss: 'What happens to the decimal part?' },
      { kind: 'choice', q: '<code>int sum = 7; int count = 2;</code> Which gives 3.5?', opts: [{ h: 'sum / count', c: true, why: 'Both are ints.' }, { h: '(double) sum / count', c: true, ok: true, why: 'sum becomes 7.0 before dividing.' }, { h: '(double) (sum / count)', c: true, why: 'The parentheses run first, and that division uses two ints.' }] }] } },

  { t: 'Shortcuts: += and ++', level: 'faded',

  { t: 'Asking a String questions', level: 'guided',

      pv('3 · charAt(index)', tiles('Hearts', [1]), 'Gives back the character at that index. Here, <code>suit.charAt(1)</code> gives the highlighted one.')),
    x: `<p>A String comes with built-in actions called <span class="key">methods</span>. You use, or <span class="key">call</span>, a method by writing the variable, a dot, the method's name, and parentheses. Anything the method needs goes inside the parentheses.</p>
      <p>A method can give a value back. That's called <span class="key">returning</span> a value. You can store what it returns: <code>int len = suit.length();</code></p>
      <p>Since indexes start at 0, the last index is always one less than the length. Asking for an index past the end crashes the program.</p>`,

      { kind: 'choice', q: 'What does <code>"Clubs".charAt(0)</code> return?', opts: [{ h: "'C'", c: true, ok: true, why: 'Index 0 is the first character.' }, { h: "'l'", c: true, why: 'Where does counting start?' }, { h: "'s'", c: true, why: 'That is at the end.' }] },
      { kind: 'input', q: 'What is the last index in <code>"Diamond"</code>?', ok: isNum(6), a: '6', errs: [[isNum(7), 'That is the length. Counting starts at 0.']], miss: 'length minus one.' }] } },

  { t: 'Math methods: the tool wall', level: 'guided',

  { t: 'Random numbers: the dice machine', level: 'guided',
    v: () => strip('Using Random',
      pv('1 · Import it', `<code class="mono">import java.util.Random;</code>`, 'This line goes at the very top of the file, above the class header.'),
      pv('2 · Build the machine', `<code class="mono">Random rand = new Random();</code>`, 'This makes a random-number maker named rand.'),
      pv('3 · Roll it', `<code class="mono">rand.nextInt(6)</code>`, 'Returns one of 6 possible whole numbers, starting at 0.')),
    x: `<p>Math is always available because it belongs to <code>java.lang</code>, a package Java loads into every program (String and System live there too). Other tools are stored in packages that you have to name first. An <span class="key">import</span> line at the top of the file tells Java where to find one. <code>Random</code> lives in the package <code>java.util</code>.</p>
      <p>The word <code>new</code> builds a Random machine for you to use. Part 2 explains exactly how <code>new</code> works. For now, copy the pattern.</p>
      <p><code>rand.nextInt(n)</code> returns a whole number from 0 up to n - 1. For a range from <i>low</i> to <i>high</i>, use <code>rand.nextInt(high - low + 1) + low</code>.</p>`,
    words: [['import', 'a line at the top of a file that lets you use a tool from a Java package'], ['nextInt(n)', 'returns a random whole number from 0 to n - 1']],
    rem: 'nextInt(n) gives 0 to n - 1. Add low to shift: nextInt(high - low + 1) + low.',
    task: { kind: 'quiz', qs: [
      { kind: 'input', q: 'What is the largest value <code>rand.nextInt(10)</code> can return?', ok: isNum(9), a: '9', errs: [[isNum(10), 'It returns 10 possible values. Where does it start?']], miss: 'Starts at 0, 10 values.' },
      { kind: 'choice', q: 'Which returns 1 to 13, like card values?', opts: [{ h: 'rand.nextInt(13)', c: true, why: 'What is the smallest value this can return?' }, { h: 'rand.nextInt(13) + 1', c: true, ok: true, why: '0 to 12, then shifted up by 1.' }, { h: 'rand.nextInt(14)', c: true, why: 'What is the smallest value this can return?' }] }] } },

  { t: 'How big can a number get?', level: 'faded',
    v: () => strip('Number limits',
      pv('1 · A full int', vbox('n', '2147483647'), 'The biggest value an int can hold.'),
      pv('2 · Add one', vbox('n', '?', 'int', true), 'What happens? The text below explains.'),
      pv('3 · A bigger box', vbox('big', '2147483648', 'long'), 'The type <code>long</code> holds much bigger whole numbers.')),
    x: `<p>Every number type has a limit. Going past the limit is called <span class="key">overflow</span>: the value wraps around to the most negative number, like a car's odometer rolling over. Java doesn't warn you, so choose a type big enough for your values.</p>
      <p>Whole-number types from small to big: <code>byte</code>, <code>short</code>, <code>int</code>, <code>long</code>. Decimal types: <code>float</code> and <code>double</code>. A letter after a literal marks its type: <code>5000000000L</code> is a long, <code>2.5F</code> is a float. You can also write <code>var</code> instead of a type, and Java figures the type out from the value: <code>var n = 5;</code> makes an int.</p>`,
    words: [['overflow', 'going past a type’s limit, so the value wraps around'], ['long', 'a whole-number type with a much bigger range than int'], ['var', 'lets Java figure out the type from the value']],
    rem: 'Past an int’s limit (about 2.1 billion) it wraps around. Use long for bigger whole numbers.',
    task: { kind: 'choice', q: 'A counter needs to hold about 8,000,000,000. Which type?', opts: [
      { h: 'int', why: 'What is the int limit?' },
      { h: 'long', ok: true, why: 'That is past the int limit of about 2.1 billion.' },
      { h: 'char', why: 'char holds one character.' }],
      hints: ['An int holds up to about 2.1 billion.'], worked: 'long, because 8 billion overflows an int.' } },

  { t: 'Scanner: the intake dock', level: 'guided',

      <p>Then call the method that matches what you expect the user to type:</p>

  { t: 'Mixing nextInt and nextLine', level: 'faded',

    x: `<p>So far every statement ran, top to bottom. An <span class="key">if statement</span> lets a program decide whether to run some statements.</p>
      <p>It has a <span class="key">condition</span> in parentheses: a question whose answer is either <code>true</code> or <code>false</code>, like <code>qty &gt; 10</code> ("is qty greater than 10?"). After it comes a <span class="key">block</span>: statements between <code>{</code> and <code>}</code>. The block runs only when the condition is true. Notice there is no semicolon after the condition.</p>
      <p>Run the code to watch the decision happen.</p>`,
    trace: { prim: true, code: ['int qty = 12;', 'if (qty > 10) {', '   System.out.println("Bulk order");', '}', 'System.out.println("Done");'], steps: [

    words: [['if statement', 'runs a block only when its condition is true'], ['condition', 'an expression that is true or false'], ['block', 'statements between { and }']],
    rem: 'if (condition) { ... } runs the block only when the condition is true.',
    task: { kind: 'choice', q: 'What prints when qty is 4?', code: ['if (qty > 10) {', '   System.out.println("Bulk order");', '}', 'System.out.println("Done");'], opts: [

      hints: ['Is 4 > 10?'], worked: 'Only Done.' } },

  { t: 'while: loop while the gate says yes', level: 'guided',

    x: `<p>A <span class="key">loop</span> repeats statements. A <span class="key">while loop</span> looks like an if, but after its block finishes, Java goes back up and checks the condition again. It keeps repeating as long as the condition is true. The block is called the <span class="key">loop body</span>, and each run of the body is one <span class="key">iteration</span>.</p>

      { at: 5, run: m => M.print(m, 'Done'), note: 'The program carries on after the loop.' }] },
    words: [['while loop', 'repeats its body while a condition is true'], ['iteration', 'one run of the loop body'], ['loop body', 'the statements inside the loop’s braces']],

  { t: 'A method is a machine on the line', level: 'guided',

      pv('3 · One result comes out', `<code class="mono">16</code>`, '<code>return</code> sends the answer back to where the call was.'))

    x: `<p>You've used main and called methods like <code>Math.sqrt</code>. Now you'll write your own methods, so a job can be written once and used many times.</p>
      <p>A method is written inside the class, next to main (not inside main). Its header follows the same pattern as main's: <code>public static</code>, then the <span class="key">return type</span> (the type of value it hands back), then its name, then its parameters in parentheses. A <span class="key">parameter</span> is a variable that receives a value when the method is called. Inside, <code>return</code> hands a value back and ends the method.</p>
      <p>In the example, <code>square(4)</code> puts 4 into the parameter n, and the method returns n * n.</p>`,
    words: [['method', 'a named block of statements you can call'], ['parameter', 'a variable in the header that receives an argument'], ['return', 'sends a value back to the caller and ends the method']],

  { t: 'Recursion: a method that calls itself', level: 'guided',
    v: () => strip('Nesting crates',
      pv('1 · Open a crate', nest(['countdown(2)']), 'The method runs and calls itself with a smaller number.'),
      pv('2 · Smaller and smaller', nest(['countdown(2)', 'countdown(1)', 'countdown(0)']), 'Each call opens a smaller crate inside the last one.'),
      pv('3 · The smallest crate', nest(['countdown(0)'], 'base case: stop'), 'At 0, it stops calling itself. That’s the base case.')),
    x: `<p>A method can call other methods. It can even call itself. A method that calls itself is a <span class="key">recursive method</span>. Each call gets its own separate copy of its parameters, like a new crate opened inside the last one.</p>
      <p>For this to end, there must be a <span class="key">base case</span>: an input small enough that the method answers without calling itself again. Every other call works on a smaller input, moving toward the base case. Run the code to watch the calls nest.</p>`,
    trace: { prim: true, code: ['public static void countdown(int n) {', '   if (n == 0) {', '      System.out.println("Go!");', '   } else {', '      System.out.println(n);', '      countdown(n - 1);', '   }', '}', '', '// in main:', 'countdown(2);'], steps: [
      { at: 10, run: m => M.decl(m, 'int', 'n (call 1)', 2, false), note: 'The first call. Its own n is 2.' },
      { at: 1, run: () => {}, note: '2 == 0 is false, so the else runs.' },
      { at: 4, run: m => M.print(m, '2'), note: 'Prints 2.' },
      { at: 5, run: m => M.decl(m, 'int', 'n (call 2)', 1, false), note: 'Calls itself with 1. A second crate opens with its own n.' },
      { at: 1, run: () => {}, note: '1 == 0 is false.' },
      { at: 4, run: m => M.print(m, '1'), note: 'Prints 1.' },
      { at: 5, run: m => M.decl(m, 'int', 'n (call 3)', 0, false), predict: { q: 'The third call gets n = 0. Will it call itself again?', opts: [{ h: 'Yes, with -1', why: 'Check line 2 with n = 0.' }, { h: 'No', ok: true, why: 'n == 0 is true, so it prints Go! and stops calling.' }] }, note: 'A third crate, with n = 0.' },
      { at: 1, run: () => {}, note: '0 == 0 is true. Base case.' },
      { at: 2, run: m => M.print(m, 'Go!'), note: 'Prints Go!' },
      { at: 7, run: drop('n (call 3)'), note: 'Call 3 ends. Its n is thrown away.' },
      { at: 7, run: drop('n (call 2)'), note: 'Back in call 2, which also ends.' },
      { at: 7, run: drop('n (call 1)'), note: 'Back in call 1, which ends. The crates close from the inside out.' }] },
    words: [['recursive method', 'a method that calls itself'], ['base case', 'the input that is answered without another recursive call'], ['recursive case', 'the part that calls the method again on a smaller input']],
    rem: 'Every recursive method needs a base case, and each call must move toward it.',
    task: { kind: 'choice', q: 'What does <code>countdown(3)</code> print?', opts: [{ h: '3, 2, 1, 0', why: 'What does the call with n = 0 print?' }, { h: 'Go!, 1, 2, 3', why: 'Does each call print before or after it calls the next one?' }, { h: '3, 2, 1, Go!', ok: true, why: 'One number per call, then the base case prints Go!' }],
      hints: ['Each call prints its own n first.'], worked: '3, 2, 1, Go!' } },

  { t: 'When recursion goes wrong', level: 'faded',
    v: () => strip('Missing base case',
      pv('1 · Calls forever', nest(['f(3)', 'f(2)', 'f(1)', 'f(0)', 'f(-1) …'], '', true), 'Without a stopping point, the crates never stop opening.'),
      pv('2 · Out of room', outBox('StackOverflowError'), 'Java runs out of space for calls and crashes.'),
      pv('3 · The fix', `<code class="mono">if (n &lt;= 0) { return; }</code>`, 'A base case that every call will reach.')),
    x: `<p>Java keeps track of every call that hasn't finished yet in an area of memory called the <span class="key">call stack</span>. If calls keep nesting without ever reaching a base case, the stack fills up and the program crashes. So check two things: there is a base case, and each call moves toward it, like <code>n - 1</code> heading toward 0.</p>`,
    words: [['StackOverflowError', 'the crash when there are too many method calls at once']],
    rem: 'No base case (or no progress toward it) means StackOverflowError.',
    task: { kind: 'bug', code: ['public static int sumTo(int n) {', '   if (n == 0) {', '      return 0;', '   }', '   return n + sumTo(n);', '}'], line: 4,
      lineWhy: { 0: 'The header is fine.', 1: 'This is a good base case.', 2: 'The sum up to 0 is 0.' },
      why: { q: 'What should line 5 be?', opts: [{ h: 'return n * sumTo(n);', c: true, why: 'Does the argument get smaller?' }, { h: 'return n + sumTo(n - 1);', c: true, ok: true, why: 'Each call moves one step closer to 0.' }, { h: 'return sumTo(n);', c: true, why: 'Does the argument get smaller?' }] },
      hints: ['Does the argument get smaller?'], worked: 'Line 5 should be return n + sumTo(n - 1);' } },

  { t: 'Answers coming back out', level: 'faded',
    v: () => strip('How factorial(3) returns',
      pv('1 · Going in', nest(['3 * factorial(2)', '2 * factorial(1)', 'factorial(1)']), 'Each call waits for the one inside it.'),
      pv('2 · Base case', nest(['factorial(1)'], 'returns 1'), 'The smallest crate answers right away.'),
      pv('3 · Coming out', `<code class="mono">1 → 2 * 1 = 2 → 3 * 2 = 6</code>`, 'Each waiting call finishes its multiplication on the way out.'))
      + codeBlock(['public static int factorial(int n) {', '   if (n <= 1) {', '      return 1;', '   }', '   return n * factorial(n - 1);', '}']),
    x: `<p>The multiplying happens on the way <b>out</b>, after the inner call returns.</p>`,
    rem: 'Going in: smaller calls. Coming out: each call finishes with the inner answer.',
    task: { kind: 'quiz', qs: [
      { kind: 'input', q: 'What is <code>factorial(4)</code>?', ok: isNum(24), a: '24', errs: [[isNum(10), 'Multiply, don’t add: 4 × 3 × 2 × 1.']], miss: '4 × 3 × 2 × 1' },
      { kind: 'input', q: 'What is <code>factorial(1)</code>?', ok: isNum(1), a: '1', miss: 'That is the base case.' }] } },

  { t: 'Snap it together: methods', level: 'guided',

  { t: 'Type it: a recursive method', level: 'faded',
    x: `<p>Type a recursive method that adds 1 through n.</p>`,

      { p: 'Base case: start an if that checks whether n is 0.', ghost: 'if (_ == _) {', a: ['if (n == 0) {'] },
      { p: 'Inside: give back 0.', a: ['return 0;'], after: ['}'] },

      { p: 'On your own: in main, declare an int named total that holds sumTo(10).', a: ['int total = sumTo(10);'] }],
      hints: ['return n + sumTo(n - 1);'], worked: 'public static int sumTo(int n) {' } },

      model: 'The base case is the simplest input, which the method answers without calling itself again. Without it, the method would keep calling itself forever until Java runs out of room and throws a StackOverflowError.',

      { kind: 'input', q: 'What does <code>f(3)</code> give back?', code: ['public static int f(int n) {', '   if (n == 0) {', '      return 0;', '   }', '   return 2 + f(n - 1);', '}'], ok: isNum(6), a: '6', miss: '2 + 2 + 2 + 0' },
      { kind: 'choice', q: 'A recursive method has no base case. What happens?', opts: [{ h: 'It returns 0', why: 'What stops the calls?' }, { h: 'It doesn’t compile', why: 'The compiler allows it.' }, { h: 'StackOverflowError', ok: true, why: 'Calls pile up until Java runs out of room.' }] },

{ id: 'files', part: 1, n: 10, name: 'do-while, command-line arguments, and files', nick: 'The Receiving Dock', blurb: 'Loops that run at least once, input from the command line, and reading and writing files.',
  steps: [
  { t: 'Warm-up from Station 9', level: 'review',
    task: { kind: 'quiz', qs: [
      { kind: 'type', p: 'Type the base case line that gives back 1.', a: ['return 1;'] },
      { kind: 'choice', q: 'What does a recursive call need to do with its argument?', opts: [{ h: 'Move it toward the base case', ok: true, why: 'Like n - 1 heading to 0.' }, { h: 'Keep it the same', why: 'Then it never reaches the base case.' }] }] } },

  { t: 'do-while loops', level: 'guided',
    v: () => strip('do-while versus while',
      pv('1 · Run the body', lapv('show the menu', 'no check yet'), 'The body always runs at least once.'),
      pv('2 · Then check', gate('choice != 0', 'go again', 'leave'), 'The condition is checked at the bottom.'),
      pv('3 · Ends in ;', `<code class="mono">} while (choice != 0);</code>`, 'Note the semicolon after the condition.')),
    x: `<p>A <span class="key">do-while loop</span> puts the body first and the condition at the bottom, after the word <code>while</code>. It fits menus and "ask until the input is valid," where you need one run before there's anything to check.</p>${codeBlock(['int choice;', 'do {', '   System.out.println("1) Add  0) Quit");', '   choice = scnr.nextInt();', '} while (choice != 0);'])}`,
    words: [['do-while loop', 'a loop that runs its body first, then checks the condition']],
    rem: 'do { body } while (condition);  always runs at least once.',
    task: { kind: 'input', q: 'How many times does the body run?', code: ['int n = 10;', 'do {', '   n++;', '} while (n < 5);'], ok: isNum(1), a: '1', errs: [[isNum(0), 'A do-while runs the body before it checks.']], miss: 'Does it check first?', hints: ['10 < 5 is false, but when is it checked?'], worked: 'Once, then 11 < 5 is false.' } },

  { t: 'Command-line arguments', level: 'faded',
    v: () => strip('Words typed after the program name',
      pv('1 · Run it', `<code class="mono">java Greet Ada 3</code>`, 'Words after the class name are command-line arguments.'),
      pv('2 · args[0], args[1]', `<div style="display:grid;gap:6px">${vbox('args[0]', '"Ada"', 'String')}${vbox('args[1]', '"3"', 'String')}</div>`, 'They land in <code>args</code>, counted from 0.'),
      pv('3 · Text only', `<code class="mono">Integer.parseInt(args[1]) → 3</code>`, 'They are always Strings. Convert numbers yourself.')),
    x: `<p>Remember <code>String[] args</code> in main's header, the list of text values? This is where it gets filled. When a program is started by typing a command, any words typed after the class name are <span class="key">command-line arguments</span>, and Java puts them in args. Get one with square brackets and its position, counted from 0: <code>args[0]</code>. <code>args.length</code> tells you how many there are. In most editors you can set them in the run settings.</p>`,
    words: [['command-line argument', 'a word typed after the program name when you run it'], ['Integer.parseInt', 'turns a String like "3" into the int 3']],
    rem: 'args[0] is the first argument. They are Strings: use Integer.parseInt for numbers.',
    task: { kind: 'quiz', qs: [
      { kind: 'choice', q: 'For <code>java Pack 12 boxes</code>, what is <code>args[1]</code>?', opts: [{ h: '"12"', c: true, why: 'Where does counting start?' }, { h: '"Pack"', c: true, why: 'Is the class name an argument?' }, { h: '"boxes"', c: true, ok: true, why: 'args[0] is "12" and args[1] is "boxes".' }] },
      { kind: 'input', q: 'For <code>java Pack 12 boxes</code>, what is <code>args.length</code>?', ok: isNum(2), a: '2', errs: [[isNum(3), 'The class name isn’t counted.']], miss: 'Count the words after Pack.' }] } },

  { t: 'Reading a file with Scanner', level: 'guided',
    v: () => strip('Reading a file, line by line',
      pv('1 · Point at the file', `<code class="mono">new File("data.txt")</code>`, 'Needs <code>import java.io.*;</code>'),
      pv('2 · A Scanner on it', `<code class="mono">Scanner fileScan = new Scanner(new File("data.txt"));</code>`, 'Same Scanner methods, reading from the file instead of the keyboard.'),
      pv('3 · More on the truck?', gate('fileScan.hasNext()', 'read a line', 'done'), '<code>hasNext()</code> only checks. It doesn’t read anything.')),
    x: `<p>A program can read from a text file instead of the keyboard. <code>File</code> is a Java tool that names a file. Hand it to a Scanner instead of <code>System.in</code>, and the same methods (<code>nextLine()</code>, <code>nextInt()</code>...) read from the file.</p>
      <p>The file might be missing, so Java requires a warning label on main: add <code>throws IOException</code> to the end of its header. (IOException is the name of that kind of problem.) Call <code>close()</code> on the Scanner when you're done with the file.</p>`,
    words: [['File', 'a class that names a file on disk'], ['hasNext()', 'true if there is more input to read'], ['IOException', 'the error Java reports when a file can’t be used']],
    rem: 'Scanner fileScan = new Scanner(new File("name.txt"));  while (fileScan.hasNext()) { ... }  fileScan.close();',
    task: { kind: 'order', q: 'Assemble the body of main: open data.txt, print every line, then close it. Some lines are decoys.',
      lines: ['Scanner fileScan = new Scanner(new File("data.txt"));', 'while (fileScan.hasNext()) {', '   String line = fileScan.nextLine();', '   System.out.println(line);', '}', 'fileScan.close();', 'Scanner fileScan = new Scanner(System.in);', 'while (fileScan.nextLine()) {'],
      check: ids => {
        if (ids.includes(6)) return 'System.in is the keyboard. Point the Scanner at a File.';
        if (ids.includes(7)) return 'The loop should check hasNext(). nextLine() reads a line and gives back text, not true or false.';
        if (ids.length < 6) return 'Something is missing: open, loop, read, print, close the loop, close the file.';
        if (ids.some((x, i) => x !== i)) return 'Open the file first, read inside the loop, and close the file after the loop ends.';
        return null;
      },
      doneMsg: 'Open, loop while hasNext(), read and use each line, then close.',
      hints: ['Open before the loop, close after it.'], worked: 'Open, while (hasNext()), read, print, }, close.' } },

  { t: 'Splitting a record', level: 'faded',
    v: () => strip('Reading the parts of one line',
      pv('1 · One record', `<code class="mono">"Duck@Daisy@30@4.0"</code>`, 'A line from the file, with @ between the parts.'),
      pv('2 · A Scanner on the line', `<code class="mono">lineScan.useDelimiter("@");</code>`, 'A second Scanner reads the line, splitting at each @.'),
      pv('3 · Read each part', `<code class="mono">next() next() nextInt() nextDouble()</code>`, '"Duck", "Daisy", 30, 4.0.')),
    x: `<p>A file often holds one <span class="key">record</span> per line, with the pieces (called fields) separated by a symbol. That symbol is the <span class="key">delimiter</span>. A Scanner can read from a String too: <code>new Scanner(record)</code>. Tell it the delimiter with <code>useDelimiter</code>, then read each field in order. Without one, Scanner splits at spaces.</p>`,
    words: [['delimiter', 'the character that separates the fields in a record'], ['record', 'one line of related data']],
    rem: 'Scanner lineScan = new Scanner(record); lineScan.useDelimiter("@"); then next(), nextInt()...',
    task: { kind: 'input', q: 'For the record <code>"Mouse@Minnie@55@3.0"</code> with delimiter @, what does the third read, <code>nextInt()</code>, give?', ok: isNum(55), a: '55', errs: [[isNum(3), 'That is the fourth field.']], miss: 'Count the parts: Mouse, Minnie, ...', hints: ['Split at each @.'], worked: '55.' } },

  { t: 'Writing a file', level: 'faded',
    v: () => strip('Writing with PrintWriter',
      pv('1 · Open for writing', `<code class="mono">PrintWriter out = new PrintWriter("report.txt");</code>`, 'Creates the file, or replaces it if it exists.'),
      pv('2 · Print to it', `<code class="mono">out.println("Total: " + total);</code>`, 'Same print, println, and printf you already know.'),
      pv('3 · Close it', `<code class="mono">out.close();</code>`, 'Without close, the text may never reach the file.')),
    x: `<p>To create a file, use <code>PrintWriter</code>, which comes from the same <code>java.io</code> package as File. It has the same print, println, and printf methods as <code>System.out</code>, but they write into the file. You may also see it built from a <code>FileOutputStream</code>, another tool that writes to a file.</p>`,
    words: [['PrintWriter', 'a class that prints text to a file'], ['close()', 'finishes writing and frees the file']],
    rem: 'PrintWriter out = new PrintWriter("name.txt"); out.println(...); out.close();',
    task: { kind: 'choice', q: 'A program writes three lines with out.println but the file is empty. What is the likely cause?', opts: [
      { h: 'println doesn’t work with files', why: 'PrintWriter has println.' }, { h: 'The file must already exist', why: 'PrintWriter creates it.' }, { h: 'out.close() was never called', ok: true, why: 'Text waits in memory until the writer is closed.' }],
      hints: ['What is the last step?'], worked: 'The writer was not closed.' } },

  { t: 'Snap it together: loops and files', level: 'guided',
    x: `<p>Build these lines from pieces.</p>`,
    rem: 'do {  } while (x != 0);  new Scanner(new File("f.txt"))  while (fileScan.hasNext()) {',
    task: { kind: 'build', items: [
      { p: 'Close a do-while that repeats while choice is not 0.', a: ['} while (choice != 0);'], extra: ['{', 'do'] },
      { p: 'Build a Scanner named fileScan that reads data.txt.', a: ['Scanner fileScan = new Scanner(new File("data.txt"));'], extra: ['System.in', 'file'] },
      { p: 'Start a loop that runs while fileScan has more input.', a: ['while (fileScan.hasNext()) {'], extra: ['nextLine', ';'] }],
      hints: ['A do-while ends with a semicolon.'], worked: '} while (choice != 0);' } },

  { t: 'Type it: files', level: 'faded',
    x: `<p>Type the lines of a program that copies a file’s lines to the screen.</p>`,
    rem: 'import, open, loop, read, close.',
    task: { kind: 'type', items: [

      { p: 'On your own: build a Scanner named in that reads scores.txt.', a: ['Scanner in = new Scanner(new File("scores.txt"));'] },
      { p: 'On your own: start a loop that runs while in has more input.', a: ['while (in.hasNext()) {'] },
      { p: 'On your own: print the next line from in.', a: ['System.out.println(in.nextLine());'], after: ['}'] },
      { p: 'On your own: close in.', a: ['in.close();'] }],
      hints: ['new Scanner(new File("name"))', 'hasNext() checks, nextLine() reads.'], worked: 'import java.io.*;' } },

  { t: 'Explain it back', level: 'review',
    task: { kind: 'explain', q: 'In your own words, how is a do-while loop different from a while loop?',
      model: 'A while loop checks its condition first, so its body might not run at all. A do-while loop runs the body first and checks the condition at the end, so the body always runs at least once.',

        { label: 'do-while runs at least once', re: /(at least once|always runs|runs? (the body )?first|once before|end|bottom|after)/i, tip: 'Say what is guaranteed with do-while.' }] } },

{ id: 'intro', part: 2, n: 11, name: 'Objects: Introduction', nick: 'The Showroom', blurb: 'What an object is, and why programmers group data with operations.',
  steps: [
  { t: 'An object is data plus operations', level: 'guided',
    v: () => `<div class="vis">${prod({ head: 'One Card object', fields: ['suit: "Hearts"', 'value: 7'], buttons: CARD_BTNS })}</div><p class="cap">Data sits inside the casing. Operations are the buttons on the panel.</p>`,
    x: `<p>An <span class="key">object</span> is a group of internal data items plus the operations that can be performed on that data.</p><p>Picture a product that just came off the factory line. Its <span class="key">data</span> is inside the casing: a playing card knows its suit and its face value. Its <span class="key">operations</span> are buttons on the control panel: you can ask the card for its value, change its value, or get it as text. In Java, operations are called <span class="key">methods</span>.</p>`,
    words: [['object', 'data items grouped with the operations on that data'], ['method', 'an operation an object can perform']],
    rem: 'An object = its data (inside the casing) + its operations (buttons on the panel).',
    task: { kind: 'sort', q: 'Sort each item. Is it data the object holds, or an operation it can do?', cats: ['Data', 'Operation'],
      items: [
        { h: "A card's suit, like Hearts", cat: 0, why: "A suit is something the card stores. It doesn't do anything, so it's data." },
        { h: 'Give back the card as text', cat: 1, why: 'Giving something back is an action, so it is an operation (a button).' },
        { h: "A card's face value, like 7", cat: 0, why: 'The number 7 is stored inside the card. That makes it data.' },
        { h: 'Change the face value to 12', cat: 1, why: 'Changing something is an action, so it is an operation.' },
        { h: "A student's GPA", cat: 0, why: 'A GPA is a stored number, so it is data.' }],
      hints: ['Ask: is it a noun the object keeps, or a verb the object does?'],
      worked: 'Data: suit, face value, GPA. Operations: give back as text, change the face value.' } },

  { t: 'Abstraction: press the buttons, ignore the wiring', level: 'guided',
    v: () => `<div class="vis">${prod({ head: 'Card object', sealed: true, buttons: CARD_BTNS })}</div><p class="cap">The user of an object sees the panel. The inside stays hidden.</p>`,
    x: `<p>You can heat food in a microwave without knowing how its wiring works. You only need the buttons.</p><p>This is called <span class="key">abstraction</span>, also called <span class="key">information hiding</span>: someone using an object needs to know what its operations do, not how the data is stored inside. An object type built this way is an <span class="key">abstract data type (ADT)</span>.</p><p>This is also a security idea: if outside code can't reach inside the casing, it can't put bad data there.</p>`,
    words: [['abstraction', 'using an object through its operations without knowing its internals'], ['ADT', 'abstract data type: a data type whose internals are hidden behind its operations']],
    rem: 'Users of an object only need its operations. The inside is hidden on purpose.',
    task: { kind: 'choice', q: 'You are writing a driver program that uses Card objects. What do you need to know?',
      opts: [
        { h: 'Which methods a Card has and what each one does', ok: true, why: 'Right. The driver only presses buttons, so it needs to know the buttons.' },
        { h: 'How the Card stores its suit internally', why: "That's the wiring inside the casing. The driver never touches it." },
        { h: 'Every line of code inside toString()', why: "You can use toString() without reading its code, just like using a microwave's Start button." },
        { h: 'Nothing at all', why: "You still need to know which buttons exist. Otherwise you can't use the object." }],
      hints: ['Think about the microwave. What do you need to know to use it?'],
      worked: 'You need the methods and what they do. How the data is stored stays hidden (abstraction).' } },

  { t: 'One blueprint, many products', level: 'guided',

      <p class="cap">One class (blue) builds any number of objects (orange).</p>`,

{ id: 'using', part: 2, n: 12, name: 'Using a class', nick: 'The Warehouse Floor', blurb: 'Reference variables, new, the dot operator, and what lives where in memory.',
  steps: [
  { t: 'Warm-up from Station 11', level: 'review',
    x: `<p>Quick recall before new material. Pulling an idea back out of memory is what makes it stick, so try these before scrolling back.</p>`,
    task: { kind: 'quiz', qs: [
      { kind: 'choice', q: 'A class is like a...', opts: [{ h: 'blueprint', ok: true, why: 'Yes. It defines what objects will have.' }, { h: 'finished product', why: 'That is an object. The class is the plan for it.' }, { h: 'button', why: 'Buttons are methods. A class is the whole plan.' }] },
      { kind: 'choice', q: 'An object groups...', opts: [{ h: 'data plus operations', ok: true, why: 'Right, data inside the casing and buttons on the panel.' }, { h: 'only data', why: 'It also has operations (methods).' }, { h: 'only methods', why: 'It also holds data.' }] },
      { kind: 'choice', q: 'Which word builds an object?', opts: [{ h: 'new', c: true, ok: true, why: 'new is the order slip that builds a product.' }, { h: 'class', c: true, why: 'class starts a blueprint. It does not build anything.' }, { h: 'int', c: true, why: 'int is a primitive type.' }] }] } },

  { t: "The control panel: a class's public methods", level: 'guided',
    v: () => `<div class="vis"><div class="bp" style="max-width:100%"><div class="bp-tag">Card class · public methods</div><div class="bp-h">Control panel</div><ul>
      <li>setSuit(String suit) <span style="opacity:.75">· sets the suit</span></li><li>setValue(int value) <span style="opacity:.75">· sets the face value</span></li>
      <li>getSuit() <span style="opacity:.75">· gives back the suit</span></li><li>getValue() <span style="opacity:.75">· gives back the face value</span></li>
      <li>toString() <span style="opacity:.75">· gives back the card as text</span></li></ul></div></div>`,
    x: `<p>To use a class, you only need its list of <span class="key">public member methods</span>. This list is called the class's <span class="key">interface</span>. It's the control panel printed on the side of every product.</p><p>To press a button, write the object's name, a dot, then the method: <code>myCard.getSuit()</code>. That dot is the <span class="key">member access operator</span>.</p>`,
    words: [['class interface', "the class's public methods: what users of the class can call"], ['member access operator', 'the dot in myCard.getValue(), meaning "press this button on this object"']],
    rem: 'objectName.methodName() presses a button on one specific object.',
    task: { kind: 'choice', q: 'You have a Card object named myCard. Which line asks it for its face value?', opts: [
      { h: 'myCard.getValue()', c: true, ok: true, why: 'Object name, dot, method. You pressed the getValue button on myCard.' },
      { h: 'getValue(myCard)', c: true, why: 'In Java the object comes first, then a dot, then the method.' },
      { h: 'Card.getValue()', c: true, why: 'Card is the blueprint. Blueprints have no face value. Ask your product, myCard.' },
      { h: 'myCard.value', c: true, why: "value is inside the casing, so outside code can't reach it. Use the button: getValue()." }],
      hints: ['Which one starts with the object, then a dot?'], worked: 'myCard.getValue(): object, dot, method, parentheses.' } },

  { t: "Reading a class's method list", level: 'guided',
    v: () => `<div class="vis"><div class="bp" style="max-width:100%"><div class="bp-tag">String class · a few public methods</div><div class="bp-h">Control panel</div><ul>
      <li>length() <span style="opacity:.75">· returns the number of characters</span></li>
      <li>charAt(int index) <span style="opacity:.75">· returns the character at that index</span></li>
      <li>concat(String other) <span style="opacity:.75">· returns a new String: this text followed by other</span></li>
      <li>toUpperCase() <span style="opacity:.75">· returns a new String with every letter capitalized</span></li></ul></div></div>`,
    x: `<p>Every Java class comes with a list of its public methods, and each one has a short comment saying what it does. As a class <span class="key">user</span>, that list is all you get. You can see the buttons on the control panel, but the casing is sealed: you never learn how the object stores its data inside, how many bytes it takes up in memory, or how a method does its work. The class writer can even change those hidden details later, and your code keeps working, because the buttons stay the same.</p>
      <p>To use a method, read its comment and copy the pattern from the header. For example, a comment that says "returns a new String" means the method hands back a fresh piece of text, so you store it in a variable: <code>String full = first.concat(last);</code> The original <code>first</code> is unchanged.</p>
      <p>Some classes are so common that Java loads them for you automatically. They live in a package named <span class="key">java.lang</span>, and you never write an import for them. Every other package, like <code>java.util</code>, needs an import line at the top of the file.</p>`,
    words: [['class user', 'a programmer who creates and uses objects of a class, seeing only its public methods'], ['java.lang', 'the package of core classes Java makes available to every program automatically, with no import'], ['returns a new String', 'the method builds and hands back a separate String; the original text is not changed']],
    rem: 'Read the comment, copy the header pattern, store what it returns. The inside of the object stays hidden.',
    task: { kind: 'quiz', qs: [
      { kind: 'choice', q: 'A program creates <code>Card myCard = new Card();</code>. Looking only at the Card class\'s public method list, how many bytes of memory does myCard use?', opts: [
        { h: '4 bytes', why: 'Where on the control panel would that number appear?' },
        { h: '8 bytes', why: 'Where on the control panel would that number appear?' },
        { h: 'One byte per method', why: 'Methods are buttons. They don\'t tell you how storage works inside.' },
        { h: 'Unknown from the method list', ok: true, why: 'Right. How an object stores its data is hidden inside the casing. A class user only sees what the methods do.' }] },
      { kind: 'input', q: 'Using the panel above, write one statement that declares a String named <code>loud</code> and stores a fully capitalized copy of the String <code>word</code>.', ph: 'String loud = ...',
        ok: v => /^String\s+loud\s*=\s*word\s*\.\s*toUpperCase\s*\(\s*\)\s*;?$/.test(norm(v)), a: 'String loud = word.toUpperCase();',
        errs: [[v => /toUpperCase\s*\(\s*word\s*\)/.test(v), 'The object comes first, then a dot, then the method. This method takes nothing in its parentheses.'],
               [v => /^\s*loud\s*=/.test(v), 'The statement also needs to declare loud. What type is it?'],
               [v => /toUpperCase\s*;|toUpperCase\s*$/.test(v), 'A method call always ends with parentheses, even when nothing goes inside.']],
        miss: 'Type, name, =, then object.method() and a semicolon.' },
      { kind: 'choice', q: 'Which of these classes needs an import line before you can use it?', opts: [
        { h: 'String', why: 'String is in java.lang, which Java loads automatically.' },
        { h: 'Math', why: 'Math is in java.lang, which Java loads automatically.' },
        { h: 'Scanner', ok: true, why: 'Scanner lives in java.util, so the file needs import java.util.Scanner; at the top.' },
        { h: 'System', why: 'System is in java.lang, which Java loads automatically. That is why System.out.println works with no import.' }] }] } },

  { t: 'Labels and products in memory', level: 'guided',

    trace: [
      { c: 'int count = 3;', run: m => M.decl(m, 'int', 'count', 3, false), note: 'count is a primitive. Its box at address 96 holds the number 3 itself.' },
      { c: 'Card myCard;', run: m => M.decl(m, 'Card', 'myCard', null, true), note: 'myCard is a reference variable: a shipping label. It exists, but no product is attached yet, so it shows ?.' },
      { c: 'myCard = new Card();', run: m => M.set(m, 'myCard', newCard(m)),
