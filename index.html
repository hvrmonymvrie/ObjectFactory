{ id: 'detective', part: 3, n: 25, name: 'Debugging Detective', nick: 'Quality Control', blurb: 'Read the compiler’s message, find the line, fix it, and catch the bugs that compile but print the wrong thing.',
  steps: [
  { t: 'Reading the message', level: 'guided',
    v: () => strip('Three parts of every compiler message',
      pv('1 · The file', `<code class="mono">Pet.java</code>`, 'Which file to open.'),
      pv('2 · The line', `<code class="mono">:7:</code>`, 'Which line to look at. The real mistake is on that line or just before it.'),
      pv('3 · The problem', `<code class="mono">error: ';' expected</code>`, 'What Java was expecting. Read it word for word.')),
    x: `<p>When code doesn't compile, the compiler prints a message like <code>Pet.java:7: error: ';' expected</code>. Don't skim it. It tells you the file, the line, and what went wrong. Fix the first error first, because one mistake can cause several messages.</p>
      <p>Errors come in three kinds. A <span class="key">compile error</span> stops the program from running at all. A <span class="key">runtime error</span> crashes it while running. A <span class="key">logic error</span> runs fine and prints the wrong thing, with no message at all.</p>`,
    words: [['compile error', 'Java refuses to build the program and prints a message'], ['runtime error', 'the program starts, then crashes'], ['logic error', 'the program runs but the result is wrong']],
    rem: 'File : line : what Java expected. Fix the first message first.',
    task: { kind: 'quiz', qs: [
      { kind: 'input', q: 'The message says <code>Song.java:12: error: cannot find symbol</code>. Which line do you look at?', ok: isNum(12), a: '12', miss: 'The number between the colons.' },
      { kind: 'choice', q: 'A program prints <code>Total: 0</code> when it should print <code>Total: 45</code>. No message appears. Which kind of error?', opts: [{ h: 'Compile error', why: 'It compiled and ran.' }, { h: 'Runtime error', why: 'It didn’t crash.' }, { h: 'Logic error', ok: true, why: 'It ran without complaint and gave the wrong answer.' }] }] } },

  { t: 'Case 1: cannot find symbol', level: 'faded',
    v: () => `<div class="console cmsg">Main.java:5: error: cannot find symbol<br>&nbsp;&nbsp;symbol:&nbsp;&nbsp; method getname()<br>&nbsp;&nbsp;location: variable myPet of type Pet</div>`,
    x: `<p><b>cannot find symbol</b> means Java doesn't know a name you used. Usually it's spelling, capital letters, or a method that was never written. The message shows the name it couldn't find.</p>`,
    task: { kind: 'bug', code: ['// Pet.java has: public String getName()', 'Scanner scnr = new Scanner(System.in);', 'Pet myPet = new Pet();', 'myPet.setName(scnr.next());', 'System.out.println(myPet.getname());'], line: 4,
      lineWhy: { 0: 'That’s a comment telling you what Pet has.', 1: 'Line 2 is fine.', 2: 'Building the pet is fine.', 3: 'setName is spelled right.' },
      why: { q: 'What is wrong on that line?', opts: [{ h: 'The n in getname should be capital', ok: true, why: 'getName ≠ getname. Java is case-sensitive.' }, { h: 'println needs two arguments', why: 'println takes one value.' }, { h: 'myPet is spelled wrong', why: 'The message says the missing symbol is the method.' }] } } },

  { t: 'Case 2: not a statement', level: 'faded',
    v: () => `<div class="console cmsg">Lamp.java:6: error: not a statement<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;this.watts == watts;</div>`,
    x: `<p><b>not a statement</b> means the line doesn't do anything Java can run. A comparison by itself, or a method name with no parentheses, are common causes.</p>`,
    task: { kind: 'quiz', qs: [
      { kind: 'type', p: 'Retype line 6 so it stores the parameter in the field.', a: ['this.watts = watts;'] },
      { kind: 'choice', q: 'Which of these also causes “not a statement”?', opts: [
        { h: 'lamp.printInfo;', c: true, ok: true, why: 'Without parentheses, it names the method but doesn’t call it.' },
        { h: 'lamp.printInfo();', c: true, why: 'This one is a correct call.' }] }] } },

  { t: 'Case 3: wrong constructor arguments', level: 'faded',
    v: () => `<div class="console cmsg">Shop.java:9: error: constructor Book in class Book cannot be applied to given types;<br>&nbsp;&nbsp;required: String,int<br>&nbsp;&nbsp;found:&nbsp;&nbsp;&nbsp; int,String</div>`,
    x: `<p>This message lists what the constructor <b>requires</b> and what you <b>passed</b>. Line them up, one argument at a time.</p>`,
    task: { kind: 'quiz', qs: [
      { kind: 'choice', q: 'Line 9 is <code>Book b = new Book(192, "Hatchet");</code> What is wrong?', opts: [
        { h: 'The arguments are in the wrong order', ok: true, why: 'The constructor wants the String first, then the int.' },
        { h: 'Book has no constructor at all', why: 'It has one. The message says what it requires.' },
        { h: 'The new keyword is missing', why: 'new is there.' }] },
      { kind: 'type', p: 'Retype line 9 correctly.', a: ['Book b = new Book("Hatchet", 192);'] }] } },

  { t: 'Case 4: already defined', level: 'faded',
    v: () => `<div class="console cmsg">Main.java:8: error: variable price is already defined in method main(String[])</div>`,
    x: `<p>A variable can be declared (given a type) only once in the same block. After that, use its name alone. This often happens when starter code already declared a variable and you declare it again.</p>`,
    task: { kind: 'bug', code: ['Scanner scnr = new Scanner(System.in);', 'int price;', 'String item;', 'item = scnr.next();', 'int price = scnr.nextInt();'], line: 4,
      lineWhy: { 0: 'Fine.', 1: 'This is the first declaration of price, which is allowed.', 2: 'Fine.', 3: 'This assigns item, which was already declared. Correct.' },
      why: { q: 'How do you fix it?', opts: [{ h: 'Drop the type: price = scnr.nextInt();', ok: true, why: 'price already exists, so just assign it.' }, { h: 'Rename: int price2 = scnr.nextInt();', why: 'That compiles, but then the original price is never set.' }, { h: 'Delete line 2, int price;', why: 'In a lab, starter lines are often read-only. Fix your own line.' }] } } },

  { t: 'Case 5: it compiles, but…', level: 'solo',
    x: `<p>Logic errors give no message. You find them by comparing the actual output with the expected output and tracing the code with the example input.</p>`,
    task: { kind: 'quiz', qs: [
      { kind: 'choice', q: 'printInfo always prints <code>Owner: null</code>, even after <code>setOwner("Ana")</code>. The setter is:', code: ['public void setOwner(String owner) {', '   owner = owner;', '}'], opts: [
        { h: 'The field is never assigned', ok: true, why: 'Both owners are the parameter, which hides the field (shadowing). Fix: this.owner = owner;' },
        { h: 'printInfo prints the wrong thing', why: 'printInfo shows the field. Why is the field still null?' },
        { h: 'Strings can’t be stored in fields', why: 'They can. Look at which owner gets assigned.' }] },
      { kind: 'choice', q: 'The input is <code>Ana</code> then <code>12</code>. What goes wrong?', code: ['int years = scnr.nextInt();', 'String name = scnr.next();'], opts: [
        { h: 'It reads in the wrong order and crashes', ok: true, why: 'nextInt() sees "Ana", which isn’t a number: InputMismatchException. Read in the same order as the input.' },
        { h: 'It works, Java sorts the input', why: 'Scanner reads in order, one value after another.' }] },
      { kind: 'choice', q: 'Expected <code>Chef: Ana (12 years)</code> but the program prints <code>Chef: Ana(12 years)</code>. Where is the fix?', code: ['System.out.println("Chef: " + name + "(" + years + " years)");'], opts: [
        { h: 'Add a space before the (', ok: true, why: '" (" puts the space in the output.' },
        { h: 'Add a space after the (', why: 'Compare again: the gap is missing before the parenthesis.' },
        { h: 'Change years into a String', why: 'The number is fine. Compare the characters around it.' }] }] } },

  { t: 'Case 6: missing return', level: 'solo',
    v: () => `<div class="console cmsg">Song.java:14: error: missing return statement<br>&nbsp;&nbsp;&nbsp;}</div>`,
    x: `<p>A method whose header promises a value (any return type except <code>void</code>) must end by returning one.</p>`,
    task: { kind: 'quiz', qs: [
      { kind: 'choice', q: 'Which method causes that error?', opts: [
        { h: 'public int getPlays() { System.out.println(plays); }', c: true, ok: true, why: 'It promises an int but only prints. It needs return plays;' },
        { h: 'public void printPlays() { System.out.println(plays); }', c: true, why: 'void promises nothing, so no return is needed.' }] },
      { kind: 'type', p: 'Write the missing line for getPlays.', a: ['return plays;', 'return this.plays;'] }] } }
  ] },

{ id: 'formats', part: 3, n: 26, name: 'printInfo() with choices', nick: 'The Label Sorter', blurb: 'Pick one of several output formats with if, else if, and else, and test every case, not just the example.', skill: 'if-format',
  steps: [
  { t: 'One label, three versions', level: 'guided', skill: 'if-format', stage: 'discover',
    v: () => strip('A Shop prints its hours three ways',
      pv('Both hours known', `<code class="mono">openHour 9, closeHour 17</code>`, 'Prints <code>(9 to 17)</code>'),
      pv('Only opening known', `<code class="mono">openHour 9, closeHour -1</code>`, 'Prints <code>(9 onward)</code>'),
      pv('Anything else', `<code class="mono">openHour -1, closeHour -1</code>`, 'Prints <code>(hours unknown)</code>')),
    x: `<p>Labs often say “print one of three formats.” That's an <span class="key">if / else if / else chain</span>: Java checks each condition from the top, runs the <b>first</b> one that is true, and skips the rest. The final <code>else</code> catches every case nothing above matched.</p>
      <p>Here, -1 is a <span class="key">sentinel</span>: a special value that means “not known.” So “known” means 0 or more: <code>&gt;= 0</code>.</p>`,
    words: [['else if', 'another condition, checked only when every condition above it was false'], ['sentinel value', 'a special value, like -1, that stands for “missing” or “stop”']],
    rem: 'if / else if / else: the first true condition wins; else catches the rest.',
    trace: { prim: true, code: ['int openHour = 9;', 'int closeHour = -1;', 'if (openHour >= 0 && closeHour >= 0) {', '   System.out.println("(" + openHour + " to " + closeHour + ")");', '} else if (openHour >= 0) {', '   System.out.println("(" + openHour + " onward)");', '} else {', '   System.out.println("(hours unknown)");', '}'],
      steps: [
        { at: 0, run: m => M.decl(m, 'int', 'openHour', '9', false), note: 'openHour is 9.' },
        { at: 1, run: m => M.decl(m, 'int', 'closeHour', '-1', false), note: 'closeHour is -1, the “not known” value.' },
        { at: 2, run: () => {}, predict: { q: 'Is openHour >= 0 && closeHour >= 0 true?', opts: [{ h: 'Yes', why: '&& needs both sides true. Is -1 >= 0?' }, { h: 'No', ok: true, why: 'closeHour is -1, so the right side is false, and && needs both.' }] }, note: 'False: closeHour is not 0 or more. Java skips this block.' },
        { at: 4, run: () => {}, note: 'Next condition: openHour >= 0 is true.' },
        { at: 5, run: m => M.print(m, '(9 onward)'), note: 'The first true condition runs. Everything below it is skipped.' }] },
    task: { kind: 'choice', q: 'With <code>openHour = -1</code> and <code>closeHour = 17</code>, what prints?', opts: [
      { h: '(-1 to 17)', c: true, why: 'The first condition needs both to be 0 or more.' },
      { h: '(-1 onward)', c: true, why: 'The second condition checks openHour. Is -1 >= 0?' },
      { h: '(hours unknown)', c: true, ok: true, why: 'Neither condition is true, so else runs. Edge cases like this are exactly what graders test.' }],
      hints: ['Check each condition from the top with these two values.'] } },

  { t: 'Pick the condition', level: 'guided', skill: 'if-format', stage: 'recognize',
    x: `<p>Translate the words of the prompt into a condition. “Both” means <code>&amp;&amp;</code>. “Either” means <code>||</code>. “Nonnegative” means 0 or more: <code>&gt;= 0</code>. “Negative” means less than 0: <code>&lt; 0</code>.</p>`,
    task: { kind: 'quiz', qs: [
      { kind: 'choice', q: 'A Sale has <code>startDay</code> and <code>endDay</code>. The prompt says “if both days are nonnegative.” Which condition?', opts: [
        { h: 'startDay >= 0 && endDay >= 0', c: true, ok: true, why: 'Both → &&, and nonnegative → >= 0.' },
        { h: 'startDay >= 0 || endDay >= 0', c: true, why: '|| is true when either one is. The prompt says both.' },
        { h: 'startDay && endDay >= 0', c: true, why: 'Each side of && needs its own full comparison.' },
        { h: 'startDay > 0 && endDay > 0', c: true, why: '> 0 leaves out 0, but 0 is nonnegative.' }] },
      { kind: 'choice', q: '“If the start day is nonnegative and the end day is negative.” Which condition?', opts: [
        { h: 'startDay >= 0 && endDay < 0', c: true, ok: true, why: 'Negative means less than 0.' },
        { h: 'startDay >= 0 && endDay <= 0', c: true, why: '0 is not negative, so <= 0 is one value too many.' },
        { h: 'startDay >= 0 || endDay < 0', c: true, why: '“and” means both must be true: &&.' }] }] } },

  { t: 'Arrange the chain', level: 'guided', skill: 'if-format', stage: 'arrange',
    task: { kind: 'order', q: 'Order Sale’s printInfo. The most specific case goes first. One line is a decoy.',
      lines: ['public void printInfo() {', '   if (startDay >= 0 && endDay >= 0) {', '      System.out.println("(" + startDay + " to " + endDay + ")");', '   } else if (startDay >= 0) {', '      System.out.println("(" + startDay + " onward)");', '   } else {', '      System.out.println("(dates unknown)");', '   }', '}', '   if (startDay >= 0) {'],

        for (let i = 0; i < 9; i++) if (a[i] !== i) return i === 1 ? 'Check the both-known case first. If “start known” came first, it would catch the both-known case too.' : i === 3 ? 'After the first case comes else if.' : i === 5 ? 'The last case is a plain else.' : i >= 7 ? 'Close the chain, then the method.' : 'Each condition line is followed by its print.';
        return null;

/* drag pieces between zones and into any position; a short tap still works as before */
function dragSort(root, sel, zones, onDrop) {
  root._drag = { sel, zones, onDrop };
  if (root._dragInit) return;
  root._dragInit = true;
  let st = null, ghost = null;
  const clear = () => $$('.ins-before,.ins-end', root).forEach(x => x.classList.remove('ins-before', 'ins-end'));
  const where = (x, y) => {
    const { sel, zones } = root._drag;
    for (const [name, z] of Object.entries(zones())) {
      const r = z.getBoundingClientRect();
      if (x < r.left - 12 || x > r.right + 12 || y < r.top - 12 || y > r.bottom + 12) continue;
      const items = $$(sel, z).filter(p => p !== st.el);
      let idx = items.length;
      for (let i = 0; i < items.length; i++) { const q = items[i].getBoundingClientRect(); if (y < q.top || (y <= q.bottom && x < q.left + q.width / 2)) { idx = i; break; } }
      return { name, z, items, idx };
    }
    return null;
  };
  root.addEventListener('pointerdown', e => {
    const el = e.target.closest(root._drag.sel);
    if (!el || !root.contains(el) || el.disabled || e.button > 0) return;
    st = { el, id: +el.dataset.i, x: e.clientX, y: e.clientY, on: false };
  });
  addEventListener('pointermove', e => {
    if (!st) return;
    if (!st.on) {
      if (Math.hypot(e.clientX - st.x, e.clientY - st.y) < 6) return;
      st.on = true;
      const r = st.el.getBoundingClientRect();
      st.dx = st.x - r.left; st.dy = st.y - r.top;
      ghost = st.el.cloneNode(true); ghost.classList.add('ghost-drag'); ghost.style.width = r.width + 'px';
      document.body.appendChild(ghost); st.el.classList.add('drag-src');
    }
    e.preventDefault();
    ghost.style.left = (e.clientX - st.dx) + 'px'; ghost.style.top = (e.clientY - st.dy) + 'px';
    clear();
    const w = where(e.clientX, e.clientY);
    if (w) { if (w.items[w.idx]) w.items[w.idx].classList.add('ins-before'); else w.z.classList.add('ins-end'); }
  }, { passive: false });
  const end = e => {
    if (!st) return;
    const s0 = st; st = null;
    if (!s0.on) return;
    st = s0; const w = e.type === 'pointerup' ? where(e.clientX, e.clientY) : null; st = null;
    ghost.remove(); ghost = null; clear(); s0.el.classList.remove('drag-src');

  };

}
function tOrder(t, el, done, miss) {

  const draw = () => {

    $('.ans', el).innerHTML = ans.map(i => `<button class="pline" data-i="${i}">${hl(t.lines[i])}</button>`).join('') || '<div class="empty">Tap lines in the bin to start</div>';

  };
}

    const before = (S.sk[id] || {}).lvl || 0;
    if (mode === 'solo') { if (S.sk[id] && S.sk[id].due && S.sk[id].due <= now()) reviewed(id, clean); else practice(id, 'solo', clean); }
    else practice(id, 'guided', clean);
    award(clean);
    const after = S.sk[id].lvl;
    $('.task-body', app).insertAdjacentHTML('beforeend', `<div class="fb ${clean ? 'good' : 'info'}" style="display:block"><strong>${after > before ? `New level: ${SK_LV[after]}.` : clean ? 'Clean run.' : 'Done, with help.'}</strong>${mode === 'guided' && clean ? ' Ready to try it on your own?' : !clean ? ' Help is fine while learning. To count as Written solo, do one with no help.' : ' A new class next time keeps it from turning into memorizing.'}</div>`);
    const a = $('.again', app); a.hidden = false; a.onclick = () => drill(id, mode === 'guided' && clean ? 'solo' : mode);
  });
  scrollTo(0, 0);
}
function labPrep() {
  app.innerHTML = `<section class="st-head"><button class="back">← Factory floor</button><div class="eyebrow">Lab Prep</div><h1>Pick a skill to drill</h1></section>
    <article class="step"><div class="explain"><p>Each drill uses a different class and different names, so you practice the pattern, not one answer. <b>With a pattern</b> shows the shape of each line. <b>On your own</b> shows nothing, and that's the one that counts toward Written solo.</p></div>
    <ul class="labs">${Object.keys(SKILLS).sort((a, b) => (SKILLS[a].grp ? 0 : 1) - (SKILLS[b].grp ? 0 : 1)).map(id => `<li><div><b>${SKILLS[id].name}</b> ${lvPill(id)}<small>${SKILLS[id].grp ? 'Basics · written in main' : SKILLS[id].where === 'main' ? 'Written in main' : 'Written in the class file'}</small></div><div class="row"><button class="btn ghost" data-id="${id}" data-m="guided">With a pattern</button><button class="btn go" data-id="${id}" data-m="solo">On your own</button></div></li>`).join('')}</ul></article>`;
  $('.back', app).onclick = home;
  $$('.labs button', app).forEach(b => b.onclick = () => drill(b.dataset.id, b.dataset.m));
  scrollTo(0, 0);
}

/* ---------- review session: due skills, mixed together, each with new names ---------- */
function review() {
  const ids = shuffle(dueSkills()).slice(0, 6);
  if (!ids.length) return home();
  let k = 0; const res = [];
  const show = (tries = 0) => {
    const id = ids[k], task = genTask(id, 'solo');
    app.innerHTML = `<section class="st-head"><button class="back">← Factory floor</button><div class="eyebrow">Review · ${k + 1} of ${ids.length}</div><h1>${SKILLS[id].name}</h1></section>
      <article class="step"><header><div class="step-meta"><span class="lvl review">Recall</span>${lvPill(id)}</div><h2>From memory</h2></header>
      <div class="explain"><p>${task.intro}</p></div>
      <section class="task"><div class="task-h">Your move</div><div class="task-body"></div></section>
      <div class="step-foot"><button class="btn go nextr" hidden>${k + 1 < ids.length ? 'Next skill →' : 'Finish review →'}</button></div></article>`;
    $('.back', app).onclick = home;
    drillCard(task, $('.task-body', app), clean => {
      reviewed(id, clean); award(clean); res.push([id, clean]);
      const k2 = S.sk[id];
      $('.task-body', app).insertAdjacentHTML('beforeend', clean
        ? `<div class="fb good" style="display:block"><strong>Remembered.</strong>Next time: ${whenText(k2.due)}.</div>`
        : `<div class="fb info" style="display:block"><strong>Worth another look.</strong>This one comes back sooner, ${whenText(k2.due)}. ${k2.miss >= 2 ? 'You’ve missed it twice in a row, so a short trip back to the lesson will help.' : ''}${k2.miss >= 2 ? '<div class="row"><button class="btn ghost golesson">Go to the lesson</button></div>' : ''}</div>`);
      const gl = $('.golesson', app); if (gl) gl.onclick = () => station(STATIONS.find(x => x.id === SKILLS[id].lesson), 0);
      const n = $('.nextr', app); n.hidden = false; n.onclick = () => { k++; if (k < ids.length) show(); else done(); };
    });
    scrollTo(0, 0);
  };
  const done = () => {
    app.innerHTML = `<section class="st-head"><button class="back">← Factory floor</button><div class="eyebrow">Review</div><h1>Review complete</h1></section>
      <article class="step endcard"><ul class="cheat">${res.map(([id, ok]) => `<li><small>${ok ? 'Remembered' : 'Coming back sooner'}</small>${SKILLS[id].name} · next ${whenText(S.sk[id].due)}</li>`).join('')}</ul>
      <div class="row"><button class="btn go gohome">Back to the factory floor</button></div></article>`;
    $('.back', app).onclick = home; $('.gohome', app).onclick = home;
  };
  show();
}

function home() {
  const open = STATIONS.filter(s => !s.soon);
  app.innerHTML = `<section class="hero">
    <div class="eyebrow">Java · An intro course, start to finish</div>
    <h1>Object Factory</h1>
    <p>Learn Java one station at a time: Part 1 covers the basics, Part 2 covers classes and objects, and Part 3 drills lab skills until you can write them from memory.</p>
    <div class="legend"><span><i style="background:var(--blueprint)"></i>Blueprint (class)</span><span><i style="background:var(--product)"></i>Product (object)</span><span><i style="background:var(--safety)"></i>Your move</span></div>
  </section>
  ${dashboard()}
  ${[1, 2, 3].map(part => `<h2 class="part-h">${PARTS[part]}</h2><section class="floor" aria-label="${PARTS[part]}">
    ${STATIONS.filter(s => (s.part || 1) === part).map(s => {
      const d = doneSet(s.id).size, n = s.steps ? s.steps.length : 0, complete = n && d >= n;
      return `<button class="st" data-id="${s.id}" ${s.soon ? 'disabled' : ''}>
        ${s.flag ? '<div class="hazard" aria-hidden="true"></div>' : ''}
        <span class="st-num">Station ${s.n}</span>
        <span class="st-name">${s.name}</span>
        <span class="st-nick">${s.nick}${s.blurb ? ' · ' + s.blurb : ''}</span>
        ${s.flag ? `<span class="flag">${s.flag}</span>` : ''}
        <span class="st-foot">${s.soon ? '<span class="pill soon">Being built</span>' : complete ? '<span class="pill done">Complete</span>' : '<span class="pill open">Open</span>'}
        ${s.soon ? '' : `<span class="bar" aria-label="${d} of ${n} steps done"><i style="width:${n ? (100 * d / n) : 0}%"></i></span>`}</span>
      </button>`; }).join('')}
  </section>`).join('')}
  <p class="note-foot">Your progress and XP save in this browser only. Part 2's examples use a playing-card class with a suit and a face value.</p>`;
  wireDash();
  $$('.st', app).forEach(b => b.onclick = () => { const s = STATIONS.find(x => x.id === b.dataset.id); const d = doneSet(s.id); const first = s.steps.findIndex((_, i) => !d.has(i)); station(s, first < 0 ? 0 : first); });
  scrollTo(0, 0);
}

function station(s, idx) {
  const d = doneSet(s.id);
  const firstOpen = (() => { const f = s.steps.findIndex((_, i) => !d.has(i)); return f < 0 ? s.steps.length : f; })();
  if (idx >= s.steps.length) return endScreen(s);
  const st = s.steps[idx];
  if (st.make) Object.assign(st, st.make());
  S.last = { id: s.id, idx }; save();
  app.innerHTML = `<section class="st-head">
      <button class="back">← Factory floor</button>
      <div class="eyebrow">Station ${s.n} · ${s.nick}</div>
      <h1>${s.name}</h1>
    </section>
    <nav class="dots" aria-label="Steps">${s.steps.map((_, i) => `<button class="dot ${d.has(i) ? 'done' : ''} ${i === idx ? 'cur' : ''}" data-i="${i}" ${i > firstOpen ? 'disabled' : ''} aria-label="Step ${i + 1}">${i + 1}</button>`).join('')}</nav>
    <article class="step">
      <header><div class="step-meta"><span class="lvl ${st.level}">${LEVEL[st.level]}</span><span>Step ${idx + 1} of ${s.steps.length}</span>${st.skill && SKILLS[st.skill] ? `<span class="skwrap">${SKILLS[st.skill].name} ${lvPill(st.skill)}</span>` : ''}</div><h2>${st.t}</h2></header>
      ${st.v ? `<div>${st.v()}</div>` : ''}
      ${st.x ? `<div class="explain">${st.x}</div>` : ''}
      ${st.trace ? '<div class="trace-wrap"></div>' : ''}
      ${st.words ? `<div class="words">${st.words.map(([w, m]) => `<button class="word" aria-expanded="false"><b>${w}</b><span> · ${m}</span></button>`).join('')}</div>` : ''}
      <section class="task" ${st.trace ? 'hidden' : ''}><div class="task-h">Your move</div><div class="task-body"></div></section>
      <div class="rem" hidden><b>Remember</b>${st.rem || ''}</div>
      <div class="hintbox"></div>
      <div class="step-foot">
        ${st.task && st.task.hints ? '<button class="btn ghost hintbtn">Hint</button>' : ''}
        ${st.task && st.task.worked ? '<button class="btn ghost solbtn" hidden>Show worked answer</button>' : ''}
        <button class="btn go nextbtn" ${d.has(idx) ? '' : 'disabled'}>${idx + 1 < s.steps.length ? 'Next step →' : 'Finish station →'}</button>
      </div>
    </article>`;
  $('.back', app).onclick = home;
  $$('.dot', app).forEach(b => b.onclick = () => station(s, +b.dataset.i));
  $$('.word', app).forEach(b => b.onclick = () => b.setAttribute('aria-expanded', b.getAttribute('aria-expanded') === 'true' ? 'false' : 'true'));
  const next = $('.nextbtn', app);
  next.onclick = () => station(s, idx + 1);

  const finish = firstTry => {
    if (!d.has(idx)) { award(firstTry); S.done[s.id] = [...(S.done[s.id] || []), st.t]; d.add(idx); save(); }
    /* skill progress counts every visit, but only a clean run (no hints, no answers shown) counts as solo */
    if (st.skill && SKILLS[st.skill]) { const clean = firstTry && !hintN && !workedShown && !(st.task && st.task._helped); practice(st.skill, st.stage, clean); const w = $('.skwrap .skl', app); if (w) w.outerHTML = lvPill(st.skill); }
    next.disabled = false;
    if (st.rem) $('.rem', app).hidden = false;
    $$('.dot', app)[idx].classList.add('done');
    const nd = $$('.dot', app)[idx + 1]; if (nd) nd.disabled = false;
  };
  const onMiss = () => { const sb = $('.solbtn', app); if (sb) sb.hidden = false; };

  let hintN = 0, workedShown = false;
  const hb = $('.hintbtn', app);
  if (hb) hb.onclick = () => { const h = st.task.hints; if (hintN < h.length) { $('.hintbox', app).insertAdjacentHTML('beforeend', `<div class="hint"><b>Hint ${hintN + 1}.</b> ${h[hintN]}</div>`); hintN++; } if (hintN >= h.length) hb.disabled = true; };
  const sb = $('.solbtn', app);
  /* multi-line tasks show only the answer for the line you're on */
  const workedFor = t => { if (t.items && t._cur != null) { const it = t.items[t._cur]; return C(it.a[0]) + (it.why ? ' ' + it.why : ''); } return t.worked; };
  if (sb) sb.onclick = () => { workedShown = true; $('.hintbox', app).insertAdjacentHTML('beforeend', `<div class="worked"><b>Worked answer.</b> ${workedFor(st.task)}</div>`); sb.disabled = true; };
  if (st.task && st.task.items) st.task.onItem = () => { $$('.hintbox .worked', app).forEach(w => w.remove()); if (sb) { sb.disabled = false; sb.hidden = true; } };

  const startTask = () => {
    const ts = $('.task', app); ts.hidden = false;
    if (st.task) RENDER[st.task.kind](st.task, $('.task-body', ts), finish, onMiss);
    else { ts.hidden = true; finish(true); }
  };
  if (st.trace) runTrace(st.trace, $('.trace-wrap', app), startTask);
  else startTask();
  if (d.has(idx) && st.rem) $('.rem', app).hidden = false;
  scrollTo(0, 0);
}

/* a trace is a list of lines run once each, or { code, steps } where each step says which line it runs (at), for loops and calls */
function runTrace(tr, el, onDone) {
  const code = Array.isArray(tr) ? tr.map(l => l.c) : tr.code;
  const lines = Array.isArray(tr) ? tr.map((l, i) => ({ ...l, at: i })) : tr.steps;
  const s0 = M.init(); if (tr.prim) s0.prim = true;
  const states = [s0];
  lines.forEach(l => { const m = M.clone(states[states.length - 1]); l.run(m); states.push(m); });
  let pos = 0, predicted = false, finished = false;
  const draw = () => {
    const nextLine = lines[pos], ranSet = new Set(lines.slice(0, pos).map(l => l.at));
    const lastAt = pos ? lines[pos - 1].at : -1, nextAt = nextLine ? nextLine.at : -1;
    el.innerHTML = `<div class="trace">
        <div><div class="mem-h">Code</div><div class="codeblock">${code.map((c, i) => `<div class="ln ${ranSet.has(i) ? 'ran' : ''} ${i === lastAt ? 'last' : ''} ${i === nextAt ? 'next' : ''}"><i>${i + 1}</i><span>${hl(c)}</span></div>`).join('')}</div></div>
        <div>${memHTML(states[pos], pos ? states[pos - 1] : null)}</div>
      </div>
      <div class="trace-ctl">
        ${pos ? `<p class="linenote"><b>${Array.isArray(tr) ? `Line ${pos}` : `Step ${pos} · line ${lastAt + 1}`}:</b> ${lines[pos - 1].note}</p>` : ''}
        <div class="pred-slot"></div>
        <div class="row">${pos < lines.length ? `<button class="btn go runbtn">Run line ${nextAt + 1}</button>` : ''}<button class="btn ghost restart">Start over</button></div>
      </div>`;
    requestAnimationFrame(() => drawArrows(el));
    const run = $('.runbtn', el);
    $('.restart', el).onclick = () => { pos = 0; predicted = false; draw(); };
    if (pos >= lines.length) { if (!finished) { finished = true; onDone(); } return; }
    if (nextLine.predict && !predicted) {
      run.disabled = true;
      const slot = $('.pred-slot', el);
      slot.innerHTML = `<div class="predict"><div class="tagline">Predict before you run line ${nextAt + 1}</div><div class="pbody"></div></div>`;
      tChoice(nextLine.predict, $('.pbody', slot), () => { predicted = true; run.disabled = false; run.textContent = `Run line ${nextAt + 1} to check`; run.focus(); }, () => {});
    }
    run.onclick = () => { pos++; predicted = false; draw(); };
  };
  draw();
}

function endScreen(s) {
  const nxt = STATIONS.find(x => x.n === s.n + 1);
  app.innerHTML = `<section class="st-head"><button class="back">← Factory floor</button><div class="eyebrow">Station ${s.n} · ${s.nick}</div><h1>Station complete</h1></section>
    <article class="step endcard">
      <p>You finished <b>${s.name}</b>. Here's the station on one page. Read it again tomorrow, or before your next study session, to lock it in.</p>
      <ul class="cheat">${s.steps.filter(x => x.rem).map(x => `<li><small>${x.t}</small>${x.rem}</li>`).join('')}</ul>
      <div class="row"><button class="btn ghost redo">Redo the station</button>${nxt && !nxt.soon ? `<button class="btn go gonext">Station ${nxt.n}: ${nxt.name} →</button>` : '<button class="btn go gohome">Back to the factory floor</button>'}</div>
    </article>`;
  $('.back', app).onclick = home;
  $('.redo', app).onclick = () => station(s, 0);
  const g = $('.gonext', app); if (g) g.onclick = () => station(nxt, 0);
  const h = $('.gohome', app); if (h) h.onclick = home;
  scrollTo(0, 0);
}

$('#homeBtn').onclick = home;
hud(); home();
