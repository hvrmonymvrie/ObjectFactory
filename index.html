    words: [['reference variable', 'a variable that holds the address of an object, not the object itself'], ['primitive', 'a basic type like int or double whose variable holds the value directly'], ['instantiate', 'to build an object from a class with new. The object is an instance of the class']],
    rem: 'A primitive variable holds its value. A reference variable holds the address of an object.',
    task: { kind: 'input', q: 'Look at the diagram. What number is stored in the myCard box?', ok: isNum(84), a: '84',
      errs: [[isNum(0), "0 is the value field inside the object. What's in the label's own box?"], [isNum(3), "3 is in count's box."], [isNum(97), "97 is the address of myCard's own box. What's written inside it?"], [isNum(96), "96 is count's address."]],
      miss: 'Find the myCard row in the Variables column and read the value on the right.', hints: ['The arrow starts at that number.'], worked: 'myCard holds 84, the address of the Card object.' } },

    trace: [
      { c: 'Card myCard = new Card();', run: m => { M.decl(m, 'Card', 'myCard', null, true); M.set(m, 'myCard', newCard(m)); }, note: 'Declare the label and build the product in one line. myCard holds 84.' },

  { t: 'Assigning one label to another', level: 'faded',
    x: `<p>This is the idea that trips up most new Java programmers, so take your time. Predict each yellow box before you run its line.</p>`,
    trace: [
      { c: 'Card a = new Card();', run: m => { M.decl(m, 'Card', 'a'); M.set(m, 'a', newCard(m)); }, note: 'Product #1 at address 84. a points to it.' },
      { c: 'Card b = new Card();', run: m => { M.decl(m, 'Card', 'b'); M.set(m, 'b', newCard(m)); }, note: 'A second new, so a second product at 92. b points to it.' },

  { t: 'Handing a label to a method', level: 'faded',
    v: () => `<div class="strip" aria-label="What a method gets when you pass a variable">
      <div class="panel"><div class="pn">1 · Pass an int</div><div class="scene">${nameTag('x', '5')}${ARR}${nameTag('n', '5')}</div><p>The method gets its own copy of the number. Changing <code>n</code> leaves <code>x</code> alone.</p></div>
      <div class="panel"><div class="pn">2 · Pass an object</div><div class="scene"><div style="display:grid;gap:8px">${nameTag('a', '84')}${nameTag('k', '84')}</div>${ARR}${box('Card object · 84', 'value', '13', true)}</div><p>The copy is the address, so both labels point to one card. <code>k.setValue(13)</code> changes that card.</p></div>
      <div class="panel"><div class="pn">3 · Repoint the copy</div><div class="scene"><div style="display:grid;gap:8px">${nameTag('a', '84')}${nameTag('k', 'null')}</div>${ARR}${box('Card object · 84', 'value', '13')}</div><p><code>k = null;</code> only moves <code>k</code>. <code>a</code> still points to the card.</p></div></div>
      ${codeBlock(['public static void upgrade(Card k) {', '   k.setValue(13);', '   k = null;', '}'])}`,
    x: `<p>A method always gets a <b>copy</b> of your variable. For an int, that's a copy of the number: <span class="key">pass by value</span>.</p><p>For an object, the copy is the address, so the method works on <b>your</b> object. This is often called <span class="key">pass by reference</span>.</p><p>A String acts like the int. Strings are <span class="key">immutable</span>: changing a String parameter makes a new String and leaves yours alone.</p><p>Run the code below to watch all three pictures happen.</p>`,
    trace: [
      { c: 'Card a = new Card();', run: m => { M.decl(m, 'Card', 'a'); M.set(m, 'a', newCard(m)); }, note: 'One product at 84. a points to it.' },
      { c: 'upgrade(a);            // call the method', run: m => M.decl(m, 'Card', 'k', M.v(m, 'a')),
        predict: { q: 'When upgrade starts, what will its parameter k hold?', opts: [{ h: 'A copy of the address in a (84)', ok: true, why: 'Right. Java copies what is in a, and that is an address.' }, { h: 'A copy of the whole Card', why: 'Only the contents of the variable get copied, and a holds an address. No new product is built.' }, { h: 'null', why: 'k gets a copy of what you passed in.' }] },
        note: 'k holds 84 too. Two labels, one product.' },
      { c: '   k.setValue(13);     // inside upgrade', run: m => { M.obj(m, 'k').fields.value = '13'; },
        predict: { q: 'Which object changes?', opts: [{ h: 'The one a points to', ok: true, why: 'Right. k and a point at the same product.' }, { h: 'A copy that only k can see', why: 'There is no copy of the object. k points at the same product as a.' }] },
        note: 'The product at 84 now has value 13. a will see it.' },
      { c: '   k = null;           // inside upgrade', run: m => M.set(m, 'k', 'null'),
        predict: { q: 'Does this change a?', opts: [{ h: 'No. Only k’s own box changes', ok: true, why: 'Right. k is a copy, so pointing it elsewhere leaves a alone.' }, { h: 'Yes, a becomes null too', why: 'k is a separate box that got a copy of the address. Changing k’s box doesn’t touch a’s box.' }] },
        note: 'k now points at nothing. a still holds 84.' },
      { c: '}                      // upgrade ends', run: m => { m.vars = m.vars.filter(v => v.name !== 'k'); }, note: 'The parameter k is thrown away when the method ends.' },
      { c: 'System.out.println(a.getValue());', run: m => M.print(m, M.obj(m, 'a').fields.value), note: 'The change made through k stuck, because it changed the product itself.' }],
    words: [['pass by value', 'the method gets a copy of the value, so changing it inside the method leaves your variable alone (primitives and Strings)'], ['pass by reference', 'the method gets the reference (address) of your object, so changes to its fields show up outside'], ['immutable', 'cannot be changed after it is made. A String is immutable: "changing" it builds a new String']],
    rem: 'A method gets a copy of your variable. For an object, the copy is the address: changes to its fields show up outside, but reassigning the parameter does not.',
    task: { kind: 'choice', q: 'What does this print?', code: ['public static void bump(int n) {', '   n = n + 1;', '}', '', 'int x = 5;', 'bump(x);', 'System.out.println(x);'], opts: [
      { h: '5', ok: true, why: 'Right. n got a copy of 5. Changing the copy leaves x alone.' },
      { h: '6', why: 'n is a copy of x. The method changed the copy, not x.' }],
      hints: ['An int variable holds the number itself. What does bump get a copy of?'], worked: 'x is an int, so bump gets a copy of 5. x still prints 5.' } },

{ id: 'define', part: 2, n: 13, name: 'Defining a class (including private fields)', nick: 'The Blueprint Office', blurb: 'Write the blueprint yourself: the class header, private fields, and methods.',
  steps: [
  { t: 'Warm-up from Station 12', level: 'review',
    x: `<p>Quick recall first. Try these without scrolling back.</p>`,
    task: { kind: 'quiz', qs: [
      { kind: 'choice', q: 'What does a Card reference variable hold?', opts: [{ h: 'The address of a Card object', ok: true, why: 'Right, a label pointing at a product.' }, { h: 'The Card object itself', why: 'The object lives on the warehouse floor. The variable holds its address.' }] },
      { kind: 'choice', q: 'After Card c = a; how many Card objects exist (if a pointed to one)?', opts: [{ h: 'One', ok: true, why: 'No new, so no new product. Two labels, one object.' }, { h: 'Two', why: 'Assigning a reference copies the address, not the object.' }] },
      { kind: 'type', p: 'Type the line that builds a Card object named hand.', a: ['Card hand = new Card();'] }] } },

  { t: 'Anatomy of a blueprint', level: 'guided',
    v: () => codeBlock(['public class Card {', '   private String suit;', '   private int value;', '', '   public void setValue(int newValue) {', '      value = newValue;', '   }', '', '   public int getValue() {', '      return value;', '   }', '}']),
    x: `<p>Up to now you used the Card blueprint. Now you'll read and write it. A class definition has three parts:</p><p><b>1. The header:</b> <code>public class Card {</code> names the blueprint. Everything until the matching <code>}</code> belongs to it, and the file must be named <code>Card.java</code>.</p><p><b>2. Fields:</b> the variables declared inside the class but outside any method. These are the data inside the casing, and every Card object gets its own copy. They're also called <span class="key">instance variables</span>, <span class="key">member variables</span>, or <span class="key">instance data items</span>.</p><p><b>3. Methods:</b> the buttons. Code inside a method can use the fields directly.</p><p>A class you write yourself, like Card, is a <span class="key">user-defined class</span>. One style note: many programmers put each opening brace on its own line, under the header. Java reads both styles the same way, and the typing boxes here accept a header with or without its <code>{</code>.</p>`,
    words: [['field', 'a variable declared in a class, outside any method; each object gets its own copy'], ['instance data item', 'another name for a field: data each object (instance) keeps for itself'], ['user-defined class', 'a class you write, as opposed to one that comes with Java, like Scanner'], ['class header', 'the first line, public class Name {, which starts the blueprint']],
    rem: 'A class = header + fields (data) + methods (buttons), all inside one pair of braces.',
    task: { kind: 'tap', q: 'Tap every line that declares a field. Then press Check.',
      lines: ['public class Card {', '   private String suit;', '   private int value;', '   public int getValue() {', '      return value;', '   }', '}'], ans: [1, 2],
      why: { 0: 'This is the class header. It starts the blueprint but holds no data.', 3: 'This starts a method, which is a button, not data.', 4: 'This line uses a field inside a method. It does not declare one.', 5: 'This closes the method.', 6: 'This closes the class.' },
      missMsg: 'You missed a field. Look for variables declared directly inside the class.',
      hints: ['Fields sit inside the class braces but outside every method.'],
      worked: 'Lines 2 and 3, private String suit; and private int value;, declare the fields.' } },

  { t: 'Private fields', level: 'guided',
    v: () => `<div class="vis">${prod({ head: 'Card object', sealed: true, buttons: ['getValue()', 'setValue()'] })}</div>${codeBlock(['// in a driver program, outside the Card class', 'Card myCard = new Card();', 'myCard.value = 99;      // compile error', 'myCard.setValue(9);     // fine: uses a button'])}`,
    x: `<p>The word <span class="key">private</span> seals a field inside the casing. Only code written inside the Card class can read or change it. Code outside, like a driver program, gets a compile error: <code>value has private access in Card</code>.</p><p>Why bother? If any program could write <code>myCard.value = 99;</code>, you'd end up with a card no deck contains. Private fields force outside code to go through methods, and methods can check the data first. Making every field private is a basic secure-coding habit.</p><p>Methods meant for outside use are marked <span class="key">public</span>. Words like <code>public</code> and <code>private</code> are called <span class="key">access modifiers</span> (some books say <i>visibility modifiers</i>).</p><p>The big idea is that an object should be <b>self-governing</b>: only the object's own methods change its data. Wrapping data and methods together this way is called <span class="key">encapsulation</span>.</p>`,
    words: [['private', 'only code inside the class can access it'], ['public', 'any code can access it'], ['access modifier', 'a word like public or private that says who can use a field or method (also called a visibility modifier)'], ['encapsulation', 'keeping an object’s data sealed inside it, reachable only through its methods, so the object governs itself']],
    rem: 'Fields are private. Outside code changes data only through public methods.',
    task: { kind: 'choice', q: 'A driver program runs myCard.value = 99; and value is declared private. What happens?', code: ['Card myCard = new Card();', 'myCard.value = 99;'],
      opts: [
        { h: 'The program does not compile', ok: true, why: 'Right. "value has private access in Card." The casing is sealed.' },
        { h: 'value becomes 99', why: 'Only code inside the Card class can touch a private field.' },
        { h: 'value becomes 0', why: 'Nothing changes, because the program never compiles.' },
        { h: 'It runs but prints a warning', why: 'Private access is checked by the compiler, so it fails before it ever runs.' }],
      hints: ['Who is allowed to touch a private field?'], worked: 'Compile error: value has private access in Card.' } },

  { t: 'Members and users', level: 'guided',
    v: () => strip('Two sides of the casing',
      pv('Inside: Card.java', `<code class="mono">private String suit;<br>public String getSuit() {<br>&nbsp;&nbsp;return suit;<br>}</code>`, 'getSuit is written inside the Card class, so it may read the private field suit.'),
      pv('Outside: DealerApp.java', `<code class="mono">Card c = new Card();<br>c.getSuit();&nbsp;&nbsp;// fine<br>c.suit;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;// error</code>`, 'DealerApp is a different class. It can only press public buttons.')),
    x: `<p>Two words describe which side of the casing a piece of code is on.</p>
      <p>A <span class="key">class member</span> is anything declared inside a class's braces: its fields and its methods. A <span class="key">member method</span> is one of those methods. Because it's written inside the class, a member method can read and change the class's private fields directly, by name.</p>
      <p>A <span class="key">class user</span> is code written somewhere else, in a different class, that creates objects of the class and calls their public methods. A driver program's <code>main</code> is a class user. Class users can call public methods, but they can't touch private fields at all.</p>
      <p>So a class definition has two parts that face different ways. <b>Public member methods</b> are the control panel that class users see. <b>Private fields</b> are the data sealed inside, reachable only by member methods. Each private field's declaration starts with the word <code>private</code>.</p>
      <p>The same programmer can be both: when you write <code>Card.java</code> you're working as a class member's author, and when you write a driver that uses Card you're a class user.</p>`,
    words: [['class member', 'a field or method declared inside a class'], ['member method', 'a method declared inside a class; it can access that class’s private fields'], ['class user', 'code in another class that creates objects of this class and calls its public methods']],
    rem: 'Members live inside the class and can reach private fields. Users live outside and only press public buttons.',
    task: { kind: 'sort', q: 'Each piece of code wants to read the private field <code>value</code> in the Card class. Sort it by which side of the casing it is on.', cats: ['Class member (can read value)', 'Class user (can’t read value)'], doneMsg: 'Ask one question: is this code written inside the Card class braces?',
      items: [
        { h: '<code>getValue()</code>, declared inside Card', cat: 0, why: 'Where is it declared?' },
        { h: '<code>main</code> in a class named CardGame', cat: 1, why: 'CardGame is a different class from Card.' },
        { h: '<code>setValue(int newValue)</code>, declared inside Card', cat: 0, why: 'Where is it declared?' },
        { h: 'A method in a Deck class that builds 52 Card objects', cat: 1, why: 'Deck makes Card objects, but it is its own class.' },
        { h: '<code>private boolean isValidValue(int v)</code>, declared inside Card', cat: 0, why: 'Private methods are still members of the class they are written in.' }] } },

  { t: 'Anatomy of a member method', level: 'guided',
    v: () => strip('One method, five parts',
      pv('The header', `<code class="mono">public int getPoints()</code>`, 'Four parts, read left to right: who may call it, what type it hands back, its name, and its parameters in parentheses.'),
      pv('The body', `<code class="mono">{<br>&nbsp;&nbsp;return points;<br>}</code>`, 'The statements between the braces: what actually happens when the button is pressed.')),
    x: `<p>Writing a class happens in a set order: name the class, declare its private fields, then define its public member methods. Together, a class's fields and methods are its <span class="key">class members</span>.</p>
      <p>Each <span class="key">method definition</span> has five parts:</p>
      <p>1. An <span class="key">access modifier</span> (<code>public</code> or <code>private</code>): who may call it.<br>2. A <span class="key">return type</span>: the type of value it hands back, or <code>void</code> if it hands back nothing.<br>3. A <b>name</b>.<br>4. <b>Parameters</b> in parentheses: the values it receives. Empty parentheses mean none.<br>5. <b>Statements</b> inside braces: the work it does.</p>
      <p>The statements inside all of a class's methods are called the class's <span class="key">implementation</span>. Class users never see the implementation. They only see each method's header and comment, which is enough to use it.</p>`,
    words: [['access modifier', 'public or private at the start of a declaration; also called a visibility modifier'], ['return type', 'the type of value a method hands back, or void for nothing'], ['implementation', 'the details inside a class’s member methods: the statements that do the work']],
    rem: 'Method definition: access modifier, return type, name, (parameters), { statements }.',
    task: { kind: 'quiz', qs: [
      { kind: 'choice', q: 'In the header <code>public void setTitle(String newTitle)</code>, what is the return type?', opts: [
        { h: 'public', c: true, why: 'That word says who may call the method.' },
        { h: 'void', c: true, ok: true, why: 'Right. void means this method hands nothing back. It only changes a field.' },
        { h: 'String', c: true, why: 'String is the type of the parameter, the value the method receives.' },
        { h: 'setTitle', c: true, why: 'That is the method’s name.' }] },
      { kind: 'choice', q: 'In the same header, what is the parameter list?', opts: [
        { h: '(String newTitle)', c: true, ok: true, why: 'Right. The parentheses hold what the method receives: one String it calls newTitle.' },
        { h: 'setTitle', c: true, why: 'That is the name. Look inside the parentheses.' },
        { h: 'void setTitle', c: true, why: 'Those are the return type and the name.' },
        { h: 'There is none', why: 'Look inside the parentheses. Are they empty?' }] },
      { kind: 'choice', q: 'A Song class has a member method <code>print()</code> and a private field <code>title</code>. Can <code>print()</code> use <code>title</code> directly?', opts: [
        { h: 'Yes', ok: true, why: 'Right. A member method is written inside the class, so it can reach every private field.' },
        { h: 'No, it must call a getter', why: 'Getters are for code outside the class. Where is print() written?' },

  { t: 'Inside a setter call', level: 'guided',
    v: () => `<div class="strip" aria-label="Three steps of a setter call">
      <div class="panel"><div class="pn">1 · You call the setter</div>${C('c.setSuit("Clubs");')}
        <div class="scene"><div class="note"><small>newSuit</small>"Clubs"</div><span class="arr" aria-hidden="true">→</span>${lockbox('null')}</div>
        <p>Java writes "Clubs" on a sticky note named <code>newSuit</code>.</p></div>
      <div class="panel"><div class="pn">2 · The setter copies it in</div>${C('suit = newSuit;')}
        <div class="scene"><div class="note"><small>newSuit</small>"Clubs"</div><span class="arr" aria-hidden="true">⤳</span>${lockbox('"Clubs"', true)}</div>
        <p>The note goes through the slot. Its value is copied into the locked <code>suit</code> field.</p></div>
      <div class="panel"><div class="pn">3 · The setter ends</div>${C('}')}
        <div class="scene"><div class="note gone"><small>newSuit</small>"Clubs"</div><span class="arr" aria-hidden="true"></span>${lockbox('"Clubs"')}</div>
        <p>The note is thrown away. The box keeps "Clubs".</p></div></div>`,
    x: `<p>Think of the object as a <b>locked box with a mail slot</b>. You can't open the box yourself, because its fields are private. You can only drop a note through the slot, and that's what a setter is.</p><p>The note is the <span class="key">parameter</span> (<code>newSuit</code>). The value written on it is the <span class="key">argument</span> (<code>"Clubs"</code>). Inside the box, <code>suit = newSuit;</code> copies the note into the field. The left side of <code>=</code> is what changes.</p><p>Now watch the same three steps happen in the memory diagram.</p>`,
    trace: [
      { c: 'Card c = new Card();', run: m => { M.decl(m, 'Card', 'c'); M.set(m, 'c', newCard(m)); }, note: 'A fresh Card. suit is null.' },
      { c: 'c.setSuit("Clubs");          // call the setter', run: m => M.decl(m, 'parameter', 'newSuit', '"Clubs"', false),
        predict: { q: 'When this call starts, what appears in memory?', opts: [{ h: 'A note named newSuit', ok: true, why: 'Right. The argument "Clubs" gets written on the parameter note.' }, { h: 'A new Card object', why: 'Calling a method never builds an object. Only new does that.' }, { h: 'Nothing yet', why: 'The parameter box appears as soon as the call starts.' }] },
        note: 'The sticky note newSuit appeared, with "Clubs" written on it. The suit field inside the box hasn\'t changed yet.' },
      { c: '   suit = newSuit;          // inside setSuit', run: m => { M.obj(m, 'c').fields.suit = '"Clubs"'; },
        predict: { q: 'suit = newSuit; runs. Which box changes?', opts: [{ h: 'The suit field', ok: true, why: 'Right. The left side of = is the one that changes.' }, { h: 'The newSuit note', why: 'The note is on the right of =, so it is only read. The left side changes.' }] },
        note: 'The note was copied into the suit field. The note itself is unchanged, because it was only read.' },
      { c: '}                            // setSuit ends', run: m => { m.vars = m.vars.filter(v => v.name !== 'newSuit'); }, note: 'The setter is done, so its sticky note is thrown away. The field keeps "Clubs".' },
      { c: 'System.out.println(c.getSuit());', run: m => M.print(m, 'Clubs'), note: 'The getter hands back a copy of the field.' }],
    words: [['parameter', 'a temporary variable in a method header that receives the value passed in'], ['argument', 'the actual value passed in the call, like "Clubs"']],
    rem: 'A setter is a mail slot: the parameter is the note, and field = parameter; copies the note into the locked box.',
    task: { kind: 'choice', q: 'Inside public void setValue(int newValue), which line stores the delivered value?', opts: [
      { h: 'value = newValue;', c: true, ok: true, why: 'Field on the left (the thing that changes), parameter on the right (the delivery).' },
      { h: 'newValue = value;', c: true, why: 'Backwards. This writes on the sticky note and leaves the field alone.' },
      { h: 'return newValue;', c: true, why: 'A setter is void, so it returns nothing. Its job is to store.' }],
      hints: ['Which box should change? Put it on the left.'], worked: 'value = newValue;' } },

  { t: 'Build the button, or press it?', level: 'guided', skill: 'call-setter', stage: 'recognize',

  { t: 'Guarding a text field', level: 'faded',

{ id: 'overload', part: 2, n: 16, name: 'Constructor overloading', nick: 'Build Options', blurb: 'More than one constructor, and how Java picks which one runs.',

  { t: 'Two build options', level: 'guided',
    v: () => codeBlock(['public Card() {', '   suit = "Hearts";', '   value = 1;', '}', '', 'public Card(String newSuit, int newValue) {', '   suit = newSuit;', '   value = newValue;', '}']),
    x: `<p>A class can have more than one constructor, as long as their <span class="key">parameter lists</span> differ. That's <span class="key">constructor overloading</span>: one assembly line with several build options. Java looks at the arguments you pass to <code>new</code> and runs the constructor whose parameters match.</p>`,
    trace: [
      { c: 'Card a = new Card();', run: m => { M.decl(m, 'Card', 'a'); M.set(m, 'a', M.build(m, 'Card', { suit: '"Hearts"', value: '1' })); }, note: 'No arguments, so the default constructor ran.' },
      { c: 'Card b = new Card("Spades", 12);', run: m => { M.decl(m, 'Card', 'b'); M.set(m, 'b', M.build(m, 'Card', { suit: '"Spades"', value: '12' })); },
        predict: { q: 'Which constructor runs for b?', opts: [{ h: 'The one with (String newSuit, int newValue)', ok: true, why: 'Right. A String and an int match that parameter list.' }, { h: 'The default one, then the values get set', why: 'Only one constructor runs, the one that matches the arguments.' }, { h: 'Both, one after the other', why: 'Java picks exactly one.' }] },
        note: 'A String and an int matched the second constructor, so b starts as the queen of spades.' }],
    words: [['overloading', 'several constructors (or methods) with the same name but different parameter lists'], ['overloaded constructor', 'a common name for a constructor with parameters, offered next to the default constructor'], ['argument', 'a value you pass in when calling, like "Spades" and 12']],
    rem: 'Java runs the one constructor whose parameters match the arguments: same count, same types, same order.',
    task: { kind: 'choice', q: 'With only those two constructors, what happens with new Card(12, "Spades")?', code: ['Card x = new Card(12, "Spades");'], opts: [
      { h: 'Compile error: no constructor takes (int, String)', ok: true, why: 'Right. Order matters, and the parameters are (String, int).' },
      { h: 'Java swaps them and builds the queen of spades', why: 'Java never reorders arguments.' },
      { h: 'The default constructor runs', why: 'Java only runs a constructor whose parameters match.' }],
      hints: ['Compare the argument types, in order, with each parameter list.'], worked: 'No constructor takes an int then a String, so it does not compile.' } },

  { t: 'Checking values in the constructor', level: 'faded',
    v: () => codeBlock(['public Card(String newSuit, int newValue) {', '   suit = newSuit;', '   if (newValue >= 1 && newValue <= 13) {', '      value = newValue;', '   } else {', '      value = 1;', '   }', '}']),
    x: `<p>A constructor that takes values is a second way in through the casing, so it should check them, just like a mutator does. When a value is bad, it stores a safe <span class="key">fallback</span> instead, so no object ever leaves the factory broken. This one falls back to 1.</p>`,
    trace: [
      { c: 'Card a = new Card("Spades", 12);', run: m => { M.decl(m, 'Card', 'a'); M.set(m, 'a', M.build(m, 'Card', { suit: '"Spades"', value: '12' })); }, note: '12 passes the check.' },
      { c: 'Card b = new Card("Clubs", 40);', run: m => { M.decl(m, 'Card', 'b'); M.set(m, 'b', M.build(m, 'Card', { suit: '"Clubs"', value: '1' })); },
        predict: { q: 'What will b’s value field hold?', opts: [{ h: '1', ok: true, why: 'Right. 40 fails the check, so the else stores the fallback.' }, { h: '40', why: 'The constructor checks the value first.' }, { h: '0', why: 'The else branch stores 1.' }] },
        note: '40 failed, so the fallback 1 was stored.' }],
    words: [['fallback', 'a safe value stored when the value passed in is invalid']],
    rem: 'Constructors that take values check them like mutators do, and store a safe fallback when they fail.',
    task: { kind: 'input', q: 'With that constructor, what prints?', code: ['Card c = new Card("Hearts", 0);', 'System.out.println(c.getValue());'], ok: isNum(1), a: '1',
      errs: [[isNum(0), '0 fails the check (1 is the lowest allowed), so the fallback is stored.']], miss: 'Does 0 pass the check? If not, what does the else store?', hints: ['Follow the else.'], worked: '0 fails, so value gets the fallback, 1.' } },

{ id: 'unit', part: 2, n: 17, name: 'Unit testing (classes)', nick: 'Quality Inspection', blurb: 'Write a small program that checks every button on a class before anyone else relies on it.',

  { t: 'Warm-up from Station 16', level: 'review',

      { kind: 'choice', q: 'Card c has a toString() that returns "7 of Hearts". What does System.out.println(c); print?', opts: [{ h: '7 of Hearts', ok: true, why: 'println calls toString() for you.' }, { h: 'c', why: 'println prints the object’s text, not the variable name.' }, { h: 'Card@1b6d3586', why: 'That is the default label, and this class overrides it.' }] }] } },

  { t: 'One class, many applications', level: 'guided',
    v: () => `<div class="vis apps-v"><div class="apps">${['CardTest', 'Rummy', 'Solitaire', 'GoFish'].map(a => `<div class="app"><small>application</small>${a}</div>`).join('')}</div>
      <div class="arrow-r" aria-hidden="true">↓</div>${uml({ name: 'Card', attrs: CARD_UML.attrs, ops: ['+ getSuit( ) : String', '+ setValue(int newValue) : void', '+ toString( ) : String', '…'] })}</div>
      <p class="cap">Many applications, one Card class.</p>`,
    x: `<p>A class with a <code>main</code> method is an <span class="key">application</span>, also called a <span class="key">driver</span>. Applications are what people actually run. They build objects from your user-defined class and press their buttons.</p><p>One well-built Card class can serve many applications: a test program, a Rummy game, a Solitaire game. Because the class can't know who will use it, it follows one firm rule: <b>the class does no input or output</b>. No Scanner and no println inside it. The application asks the user and prints results. The class just keeps its data and does its operations.</p>`,
    words: [['application', 'a class with a main method that people run; also called a driver'], ['driver', 'another name for an application that uses a class']],
    rem: 'The class keeps and guards its data. The application (the class with main) does all input and output.',
    task: { kind: 'sort', q: 'Whose job is it: the Card class, or the application that uses it?', cats: ['Card class', 'Application'],
      items: [
        { h: 'Ask the player which card to play, using a Scanner', cat: 1, why: 'Reading input is the application’s job. The class never talks to the user.' },
        { h: 'Store the suit and face value', cat: 0, why: 'Keeping its own data is exactly what the class is for.' },
        { h: 'Print the final score on the screen', cat: 1, why: 'Printing is output, so the application does it.' },
        { h: 'Refuse a face value of 99', cat: 0, why: 'Guarding its own data is the class’s job, in its mutator.' },
        { h: 'Give back the card as text with toString()', cat: 0, why: 'Returning text is fine for a class. Printing it is what the class leaves to the application.' },
        { h: 'public static void main(String[] args)', cat: 1, why: 'main is what makes a class an application.' }],
      doneMsg: 'The class keeps and guards its data. The application talks to the user.',
      hints: ['Does it talk to the user (input or output)? Then it belongs to the application.'] } },

  { t: 'The inspection station', level: 'guided',
    v: () => `<div class="strip" aria-label="Three parts of a test case">
      <div class="panel"><div class="pn">1 · Do</div>${C('c.setValue(7);')}<p>Press one button on the product.</p></div>
      <div class="panel"><div class="pn">2 · Expect</div><div class="big">7</div><p>Decide ahead of time what a correct product gives back.</p></div>
      <div class="panel"><div class="pn">3 · Compare</div>${C('if (c.getValue() != 7)')}<div class="xl"><span class="stamp">PASS</span><span class="stamp bad">FAILED</span></div><p>Only a mismatch prints a message.</p></div></div>
      <div style="margin-top:16px"><div class="plabel">The Card class being inspected: its guarded setter</div>${codeBlock(['public void setValue(int newValue) {', '   if (newValue >= 1 && newValue <= 13) {', '      value = newValue;', '   }', '}'])}</div>`,
    x: `<p>A <span class="key">testbench</span> is a small program that inspects a class. Each <span class="key">test case</span> does something, then compares the result with what it expected. <code>!=</code> means "is not equal to," so FAILED prints only when something is wrong.</p><p>Watch the guard above while you run it.</p>`,
    trace: [
      { c: 'Card c = new Card();', run: m => { M.decl(m, 'Card', 'c'); M.set(m, 'c', newCard(m)); }, note: 'The testbench builds a product to inspect.' },
      { c: 'c.setValue(7);', run: m => { M.obj(m, 'c').fields.value = '7'; }, note: 'Inside setValue, the guard checks 7. It is between 1 and 13, so it goes in.' },
      { c: 'if (c.getValue() != 7)', run: () => {},
        predict: { q: 'value is 7. Is 7 != 7 true?', opts: [{ h: 'No', ok: true, why: 'Right. 7 equals 7, so the test passes.' }, { h: 'Yes', why: '!= asks "are they different?" 7 and 7 are the same.' }] },
        note: 'False, so the next line gets skipped.' },
      { c: '   System.out.println("FAILED");', run: () => {}, note: 'Skipped. Test passed.' },
      { c: 'c.setValue(99);', run: () => {},
        predict: { q: 'Look at the guard. What will value hold after this?', opts: [{ h: '7', ok: true, why: 'Right. The guard blocks it.' }, { h: '99', why: 'The guard only lets 1 through 13 in. 99 is refused.' }] },
        note: 'The guard refused 99. value is still 7.' },
      { c: 'if (c.getValue() != 7)', run: () => {},
        predict: { q: 'value is still 7. Will FAILED print?', opts: [{ h: 'No', ok: true, why: 'Right. 7 != 7 is false, so the test passes.' }, { h: 'Yes', why: 'The guard kept 7, so 7 != 7 is false.' }] },
        note: 'False again, so the next line gets skipped.' },
      { c: '   System.out.println("FAILED");', run: () => {}, note: 'Skipped. The guard passed inspection.' },
      { c: 'System.out.println("Tests done");', run: m => M.print(m, 'Tests done'), note: 'A clean run prints only this line.' }],
    words: [['testbench', 'an application that tests a class by calling its methods and checking the results'], ['test case', 'one check: an action, the expected result, and a comparison'], ['!=', 'means is not equal to']],
    rem: 'Test case: do something, then if (actual != expected) print a FAILED message.',
    task: { kind: 'input', q: 'With the guarded setValue (1 to 13), how many FAILED lines print?', code: ['Card c = new Card();', 'c.setValue(5);', 'if (c.getValue() != 5) System.out.println("FAILED: 5");', 'c.setValue(14);', 'if (c.getValue() != 5) System.out.println("FAILED: refused 14");', 'c.setValue(13);', 'if (c.getValue() != 13) System.out.println("FAILED: 13");'], ok: isNum(0), a: '0', ph: 'type a number',
      errs: [[isNum(1), 'Check each one. 5 is stored, 14 is refused so the value stays 5, and 13 is stored. Every test passes.'], [isNum(3), 'A FAILED line prints only when the actual value differs from the expected one.']],
      miss: 'For each if, is the actual value different from the expected one?', hints: ['Track the value field line by line.'], worked: 'All three tests pass, so 0 FAILED lines print.' } },

  { t: 'Test at the edges', level: 'guided',
    v: () => `<div class="vis"><div class="edges">
      <span class="out"><small>outside</small>-5</span><span class="out edge"><small>edge</small>0</span><span class="in edge"><small>edge</small>1</span><span class="in"><small>normal</small>7</span><span class="in edge"><small>edge</small>13</span><span class="out edge"><small>edge</small>14</span></div></div>
      <p class="cap">Green values should be accepted, red ones refused. The yellow rings mark the edges.</p>`,
    x: `<p>Bugs hide at the edges. For a setter that accepts 1 through 13, the most useful test values sit right on and just past each edge: 0, 1, 13, and 14. Add one normal value like 7, and maybe a strange one like -5. Values at the edges are called <span class="key">border cases</span> (or edge cases).</p><p>Here's why: if someone types <code>&gt;</code> where they meant <code>&gt;=</code>, the card still accepts 7 and refuses 99. Only a test with exactly 1 catches the mistake.</p>`,
    words: [['border case', 'a test value at or just past the edge of what is allowed']],
    rem: 'Test the edges: just inside (1 and 13) and just outside (0 and 14), plus a normal value.',
    task: { kind: 'input', q: 'This setter has a bug. Type one test value that catches it.', code: ['public void setValue(int newValue) {', '   if (newValue > 1 && newValue <= 13) {', '      value = newValue;', '   }', '}'], ok: isNum(1), a: '1', ph: 'a test value',
      errs: [[isNum(7), '7 is accepted with or without the bug. The bug is at an edge.'], [isNum(13), '13 is accepted, which is correct. Look at the lower edge.'], [isNum(0), '0 is refused, which is correct either way. Which allowed value gets refused by mistake?'], [isNum(14), '14 is refused, which is correct. Look at the lower edge.']],
      miss: 'Which allowed value does > 1 refuse by mistake?', hints: ['Compare > 1 with >= 1. Which number is treated differently?'], worked: '1 should be accepted, but > 1 refuses it. Testing exactly 1 catches the bug.' } },

    task: { kind: 'order', q: 'Put together a complete testbench application for Card. Some lines are decoys.',

  { t: 'Rerunning tests', level: 'guided',
    x: `<p>A testbench isn't something you run once. Every time you change the class, you run the whole testbench again, because a fix in one method can break another. This is called <span class="key">regression testing</span>: checking that what used to work still works.</p><p>It's also why tests print only failures. A clean run is quiet, so a new failure stands out right away.</p>`,

{ id: 'uml', part: 2, n: 18, name: 'UML', nick: 'The Blueprint Sheet', blurb: 'Read a class diagram and translate each line of it into Java, exactly as written.',
  steps: [
  { t: 'Warm-up from Station 17', level: 'review',
    task: { kind: 'quiz', qs: [
      { kind: 'choice', q: 'A testbench is...', opts: [{ h: 'a separate test application', ok: true, why: 'Right.' }, { h: 'a method inside the class', why: 'It is a separate application with its own main.' }] },
      { kind: 'type', p: 'Type a private String field named suit.', a: ['private String suit;'] },
      { kind: 'type', p: 'Type the accessor header for an int field named value.', a: ['public int getValue() {'] }] } },

  { t: 'The blueprint sheet', level: 'guided',
    v: () => `<div class="vis">${uml({ ...CARD_UML, labels: true })}</div>`,
    x: `<p>Before anyone writes a class, someone often draws it. The standard drawing is a <span class="key">UML class diagram</span>: a box with three sections, read top to bottom.</p><p><b>1. Name</b> of the class. <b>2. Attributes:</b> the instance data (fields). <b>3. Operations:</b> the methods, constructors included.</p><p>The symbol at the start of each line is its visibility: <code>-</code> means <code>private</code> and <code>+</code> means <code>public</code>. That's why the attributes have minus signs and the operations have plus signs: data sealed inside, buttons on the outside.</p>`,
    words: [['UML', 'Unified Modeling Language: a standard way to draw classes'], ['attribute', 'UML’s word for a field (instance data)'], ['operation', 'UML’s word for a method']],
    rem: 'UML box: name / attributes / operations. - means private, + means public.',
    task: { kind: 'sort', q: 'Which section of the box does each line belong in?', cats: ['Name', 'Attribute', 'Operation'],
      items: [
        { h: U('Card'), cat: 0, why: 'A bare class name goes in the top section.' },
        { h: U('- value : int'), cat: 1, why: 'A minus, a name, and a type: that is instance data.' },
        { h: U('+ getValue( ) : int'), cat: 2, why: 'Parentheses mean it is a method.' },
        { h: U('+ Card( )'), cat: 2, why: 'Constructors are listed with the operations.' },
        { h: U('- suit : String'), cat: 1, why: 'Instance data, with no parentheses.' }],
      doneMsg: 'Top names it, the middle holds the data, the bottom holds the buttons.',
      hints: ['Parentheses mean an operation.'] } },

  { t: 'Translating an attribute line', level: 'guided',
    v: () => `<div class="strip" aria-label="Three steps to translate an attribute line">
      <div class="panel"><div class="pn">1 · The symbol becomes a word</div>${xl(chip('-'), ARR, chip('private', 'add'))}<p><code>-</code> means private. (<code>+</code> would mean public.)</p></div>
      <div class="panel"><div class="pn">2 · The type moves in front</div>${xl(chip('suit', 'nm'), chip(':'), chip('String', 'ty'), ARR, chip('String', 'ty add'), chip('suit', 'nm'))}<p>UML says name, then type. Java says type, then name. The colon disappears.</p></div>
      <div class="panel"><div class="pn">3 · End with a semicolon</div>${xl(C('private String suit;'))}<p>Same words, Java order.</p></div></div>`,
    x: `<p>A UML sheet and a Java class say the same thing in a different word order, so turning one into the other is a translation. Do it one piece at a time, the same way every time. Watch the blue type chip: it's the piece that moves.</p>`,
    rem: '- suit : String  becomes  private String suit;',
    task: { kind: 'slots', items: [
      { p: 'Translate this attribute line into a Java field, one blank at a time.', field: '- value : int', uml: true, fieldLabel: 'The sheet says', kind: 'field', parts: [0, ' ', 1, ' ', 2, ';'], done: 'private int value; Same words, Java order.',
        slots: [
          { q: 'The line starts with -. Which word is that?', opts: [{ v: 'private', ok: true, why: '- means private.' }, { v: 'public', why: '+ means public. This line has -.' }] },
          { q: 'Java puts the type first. What is the type?', opts: [{ v: 'int', ok: true, why: 'The type comes after the colon: int.' }, { v: 'value', why: 'value is the name. The type is after the colon.' }] },
          { q: 'And the name?', opts: [{ v: 'value', ok: true, why: 'The name is before the colon.' }, { v: 'Value', why: 'Copy names exactly. The sheet says value, all lowercase.' }] }] },
      { p: 'Same recipe for a Player attribute.', field: '- name : String', uml: true, fieldLabel: 'The sheet says', kind: 'field', parts: [0, ' ', 1, ' ', 2, ';'], done: 'private String name;',
        slots: [
          { q: 'Which word does - become?', opts: [{ v: 'private', ok: true, why: 'Right.' }, { v: 'public', why: '- means private.' }] },
          { q: 'The type?', opts: [{ v: 'String', ok: true, why: 'String, with a capital S, because String is a class.' }, { v: 'string', why: 'Java is case-sensitive. String is a class, so it is capitalized.' }, { v: 'name', why: 'That is the name. The type is after the colon.' }] },
          { q: 'The name?', opts: [{ v: 'name', ok: true, why: 'Copied exactly.' }, { v: 'Name', why: 'The sheet says name, lowercase.' }] }] },
      { p: 'This one has a starting value. UML shows it after an = sign, and it stays at the end.', field: '- score : int = 0', uml: true, fieldLabel: 'The sheet says', kind: 'field', parts: [0, ' ', 1, ' ', 2, ' = ', 3, ';'], done: 'private int score = 0; The starting value stays at the end, just like field initialization.',
        slots: [
          { q: 'Which word does - become?', opts: [{ v: 'private', ok: true, why: 'Right.' }, { v: 'public', why: '- means private.' }] },
          { q: 'The type?', opts: [{ v: 'int', ok: true, why: 'After the colon.' }, { v: 'score', why: 'That is the name.' }, { v: '0', why: '0 is the starting value.' }] },
          { q: 'The name?', opts: [{ v: 'score', ok: true, why: 'Before the colon.' }, { v: 'int', why: 'That is the type, and it already went in front.' }] },
          { q: 'The starting value?', opts: [{ v: '0', ok: true, why: 'It stays at the end, after =.' }, { v: '"0"', why: 'score is an int, so the value is the number 0 with no quotes.' }] }] }],
      hints: ['UML: name : type. Java: type name.'] } },

  { t: 'Translating an operation line', level: 'guided',
    v: () => `<div class="strip" aria-label="Three steps to translate an operation line">
      <div class="panel"><div class="pn">1 · The symbol becomes a word</div>${xl(chip('+'), ARR, chip('public', 'add'))}<p><code>+</code> means public.</p></div>
      <div class="panel"><div class="pn">2 · The return type jumps to the front</div>${xl(chip('getSuit( )', 'nm'), chip(':'), chip('String', 'ty'), ARR, chip('String', 'ty add'), chip('getSuit()', 'nm'))}<p>The type after the last colon is the return type. In Java it goes before the name.</p></div>
      <div class="panel"><div class="pn">3 · Open the body</div>${xl(C('public String getSuit() {'))}<p>Add the <code>{</code> and write the body.</p></div></div>`,
    x: `<p>An operation line translates the same way. The type after the last colon is the <b>return type</b>, and in Java it moves in front of the method name. <code>: void</code> means the method gives nothing back, so <code>void</code> moves to the front.</p><p>Parameters are copied into the parentheses. Some sheets write them Java-style, like <code>setSuit(String newSuit)</code>, and some write them UML-style, like <code>setSuit(newSuit : String)</code>. Either way, Java needs the type first: <code>String newSuit</code>.</p>`,
    rem: '+ getSuit( ) : String  becomes  public String getSuit() {',
    task: { kind: 'slots', items: [
      { p: 'Translate this operation into a Java method header.', field: '+ getValue( ) : int', uml: true, fieldLabel: 'The sheet says', kind: 'header', parts: [0, ' ', 1, ' ', 2, '(', 3, ') {'], done: 'public int getValue() {',
        slots: [
          { q: 'Which word does + become?', opts: [{ v: 'public', ok: true, why: '+ means public.' }, { v: 'private', why: '- would mean private.' }] },
          { q: 'The return type, from after the colon?', opts: [{ v: 'int', ok: true, why: ': int means it gives back an int.' }, { v: 'void', why: 'void would be written : void. This one gives back an int.' }] },
          { q: 'The method name?', opts: [{ v: 'getValue', ok: true, why: 'Copied exactly.' }, { v: 'getvalue', why: 'Copy the capital V exactly.' }] },
          { q: 'What goes in the parentheses?', opts: [{ v: '', ok: true, why: 'The sheet shows empty parentheses, so nothing goes in.' }, { v: 'int value', why: 'The sheet lists no parameters for this one.' }] }] },
      { p: 'Now a mutator.', field: '+ setValue(int newValue) : void', uml: true, fieldLabel: 'The sheet says', kind: 'header', parts: [0, ' ', 1, ' ', 2, '(', 3, ') {'], done: 'public void setValue(int newValue) {',
        slots: [
          { q: 'Which word does + become?', opts: [{ v: 'public', ok: true, why: 'Right.' }, { v: 'private', why: '+ means public.' }] },
          { q: 'The return type?', opts: [{ v: 'void', ok: true, why: ': void moves to the front.' }, { v: 'int', why: 'int is the parameter’s type. The return type is after the last colon: void.' }] },
          { q: 'The method name?', opts: [{ v: 'setValue', ok: true, why: 'Copied exactly.' }, { v: 'SetValue', why: 'The sheet says setValue, lowercase s.' }] },
          { q: 'The parameter?', opts: [{ v: 'int newValue', ok: true, why: 'Type first, then the name.' }, { v: 'newValue : int', why: 'That is UML order. Java puts the type first.' }, { v: 'newValue', why: 'Every parameter needs its type.' }] }] },
      { p: 'The label method.', field: '+ toString( ) : String', uml: true, fieldLabel: 'The sheet says', kind: 'header', parts: ['public ', 0, ' ', 1, '() {'], done: 'public String toString() {',
        slots: [
          { q: 'The return type?', opts: [{ v: 'String', ok: true, why: 'It gives back text.' }, { v: 'void', why: 'The sheet says : String.' }] },
          { q: 'The method name?', opts: [{ v: 'toString', ok: true, why: 'Copied exactly, capital S.' }, { v: 'tostring', why: 'The S is a capital.' }] }] }],
      hints: ['The type after the last colon moves to the front.'] } },

  { t: 'Constructors on the sheet', level: 'guided',
    v: () => `<div class="vis">${uml({ ...CARD_UML, hot: ['+ Card( )', '+ Card(String newSuit, int newValue)'] })}</div>`,
    x: `<p>Constructors are easy to spot on the sheet. Their name is the class name, and they have <b>no colon and no return type</b> at the end. That matches the Java rule you already know: constructors have no return type, not even void.</p><p>The overloaded constructor, the one with parameters, is listed right below the default one. One more symbol you may see: an <u>underlined</u> line is <span class="key">static</span>, meaning it belongs to the class itself instead of to each object. You'll meet static later.</p>`,
    words: [['static', 'belongs to the class itself, not to each object; underlined in UML']],
    rem: '+ Card( )  becomes  public Card() {   No colon, no return type.',
    task: { kind: 'choice', q: 'These lines are from the sheet for a class named Song. Which one is a constructor?', opts: [
      { h: U('+ Song(String newTitle)'), ok: true, why: 'Class name, and no return type after it.' },
      { h: U('+ getTitle( ) : String'), why: 'It has a return type, so it is a regular method.' },
      { h: U('+ setTitle(String newTitle) : void'), why: ': void is a return type. Constructors have none.' },
      { h: U('+ song( ) : Song'), why: 'Lowercase, and it has a return type.' }],
      hints: ['Look for the class name with nothing after the parentheses.'], worked: '+ Song(String newTitle) has the class name and no return type.' } },

  { t: 'The arrow between boxes', level: 'guided',
    v: () => `<div class="vis dep">${uml({ name: 'CardTest', ops: ['+ main(args : String[ ]) : void'] })}${depArrow}${uml({ name: 'Card', attrs: CARD_UML.attrs, ops: ['+ Card(String newSuit, int newValue)', '+ getValue( ) : int', '…'] })}</div><p class="cap">The dashed arrow points from the application to the class it uses.</p>`,
    x: `<p>An application gets its own box too. Its only operation is <code>main</code>. The <b>dashed arrow</b> from the application to the class is a <span class="key">dependency</span>: the application uses the class, because it builds Card objects and calls their methods.</p><p>Read the arrow as "uses." It never points back, because Card doesn't know or care which application is using it.</p>`,
    words: [['dependency', 'a dashed arrow in UML: the class at the tail uses the class the arrow points to']],
    rem: 'A dashed arrow means "uses." CardTest - - -> Card means CardTest builds and uses Cards.',
    task: { kind: 'choice', q: 'A sheet shows a dashed arrow from RummyGame to Card. What does it mean?', opts: [
      { h: 'RummyGame builds and uses Card objects', ok: true, why: 'Right. The arrow points from the user to the thing it uses.' },
      { h: 'Card builds and uses RummyGame objects', why: 'The arrow points from the user to the thing used, so RummyGame is the user.' },

  { t: 'Matching the sheet', level: 'guided',
    v: () => `<div class="vis">${uml({ name: 'Card', attrs: CARD_UML.attrs, ops: ['+ getSuit( ) : String', '+ getValue( ) : int'] })}</div>`,
    x: `<p>A UML sheet is a contract. Other people and other applications are written against it, so your class has to match it <b>exactly</b>: the same names with the same capital letters, the same types, the same visibility, and the same parameters in the same order.</p><p>Don't add instance data that isn't on the sheet. If a method needs a temporary value, use a <span class="key">local variable</span> declared inside that method. It disappears when the method ends, like the sticky-note parameter does.</p>`,
    words: [['local variable', 'a variable declared inside a method; it exists only while the method runs']],
    rem: 'Match the sheet letter for letter. No extra instance data; use local variables instead.',
    task: { kind: 'bug', code: ['public class Card {', '   private String suit;', '   private int value;', '   private int total;', '', '   public String getSuit() {', '      return suit;', '   }', '}'], line: 3,
      lineWhy: { 0: 'The class name matches the sheet.', 1: 'This matches - suit : String.', 2: 'This matches - value : int.', 5: 'This matches + getSuit( ) : String.', 6: 'Returning the field is right.', 7: 'This closes the method.', 8: 'This closes the class.' },

        { h: 'It should be a double', why: 'The type doesn’t matter. It isn’t on the sheet.' }] },
      hints: ['Compare each field with the attributes section.'], worked: 'Line 4 adds instance data the sheet doesn’t list. Remove it.' } },

  { t: 'Find the defect', level: 'solo',

  { t: 'Snap it together: sheet to Java', level: 'guided',
    v: () => `<div class="vis">${uml({ name: 'Player', attrs: ['- name : String', '- score : int'], ops: ['+ Player( )', '+ getName( ) : String', '+ setScore(int newScore) : void'] })}</div>`,

{ id: 'this', part: 2, n: 19, name: "The 'this' implicit parameter", nick: 'The Name Tag', blurb: 'The hidden parameter that tells a method which object it is working on.',
  steps: [
  { t: 'Warm-up from Station 18', level: 'review',
    task: { kind: 'quiz', qs: [
      { kind: 'type', p: `Translate ${U('- value : int')} into a Java field.`, a: ['private int value;'] },
      { kind: 'type', p: 'Type the mutator header for value, with an int parameter named newValue.', a: ['public void setValue(int newValue) {'] },
      { kind: 'choice', q: 'Inside setValue, value = newValue; changes...', opts: [{ h: 'the value field', ok: true, why: 'The left side of = is what changes.' }, { h: 'the parameter newValue', why: 'The parameter is on the right, so it is only read.' }] }] } },

  { t: 'Every call carries a name tag', level: 'guided',
    v: () => `<div class="strip" aria-label="The this name tag in two calls">
      <div class="panel"><div class="pn">Call on a</div>${C('a.setValue(5);')}<div class="scene">${nameTag('this', '84')}${ARR}${box('Card object · 84', 'value', '5', true)}</div><p>The tag holds a’s address, so value means a’s field.</p></div>
      <div class="panel"><div class="pn">Call on b</div>${C('b.setValue(9);')}<div class="scene">${nameTag('this', '92')}${ARR}${box('Card object · 92', 'value', '9', true)}</div><p>Same method, new tag: now value means b’s field.</p></div></div>`,
    x: `<p>Two Cards share one setValue method. When the method runs <code>value = newValue;</code>, how does it know <em>which</em> Card's value to change?</p><p>Every call quietly carries a <b>name tag</b> with the address of the object in front of the dot. The tag is named <code>this</code>. It's called the <span class="key">implicit parameter</span>: implicit because you never write it in the parentheses. Java fills it in for you.</p>`,

  { t: 'When names collide', level: 'guided',
    v: () => codeBlock(['public void setValue(int value) {', '   value = value;        // nothing changes', '}', '', 'public void setValue(int value) {', '   this.value = value;   // fixed', '}']),
    x: `<p>Some programmers give the parameter the same name as the field: <code>setValue(int value)</code>. Inside that method, the plain name <code>value</code> now means the <b>parameter</b>, the closest one, and the field is hidden behind it. So <code>value = value;</code> copies the parameter onto itself. The field never changes.</p><p>The name tag fixes it. <code>this.value</code> means "the value field of the object on my name tag." So <code>this.value = value;</code> reads: copy the parameter into my field.</p>`,
    trace: [
      { c: 'Card c = new Card();', run: m => { M.decl(m, 'Card', 'c'); M.set(m, 'c', newCard(m)); }, note: 'A fresh Card, value 0.' },
      { c: 'c.setValue(7);         // value = value; version', run: m => { M.decl(m, 'Card', 'this', M.v(m, 'c')); M.decl(m, 'parameter', 'value', '7', false); }, note: 'Two things are named value now: the parameter (7) and the field inside the object (0).' },
      { c: '   value = value;', run: () => {},
        predict: { q: 'Which box changes?', opts: [{ h: 'Neither one', ok: true, why: 'Right. The parameter is copied onto itself.' }, { h: 'The value field inside the object', why: 'The plain name value means the closest one, the parameter. The field is hidden.' }] },
        note: 'Nothing visible changed. The field is still 0.' },
      { c: '}', run: drop('this', 'value'), note: 'The call ends. The 7 is gone, and the field never got it.' },
      { c: 'c.setValue(7);         // this.value = value; version', run: m => { M.decl(m, 'Card', 'this', M.v(m, 'c')); M.decl(m, 'parameter', 'value', '7', false); }, note: 'Same call, fixed method.' },
      { c: '   this.value = value;', run: m => { thisObj(m).fields.value = '7'; },
        predict: { q: 'Now which box changes?', opts: [{ h: 'The field', ok: true, why: 'Right. this.value is the field. Plain value is the parameter.' }, { h: 'The parameter value', why: 'The parameter is on the right, so it is only read.' }] },
        note: 'Follow the tag to the object, then change its value field.' },
      { c: '}', run: drop('this', 'value'), note: 'The field keeps 7.' }],
    words: [['shadowing', 'when a parameter has the same name as a field, so the plain name means the parameter']],
    rem: 'Same name for the parameter and the field? Write this.field = parameter;',
    task: { kind: 'choice', q: 'Inside public void setSuit(String suit), which line stores the parameter in the field?', opts: [
      { h: 'this.suit = suit;', c: true, ok: true, why: 'this.suit is the field, and plain suit is the parameter.' },
      { h: 'suit = suit;', c: true, why: 'Both sides mean the parameter, so the field never changes.' },
      { h: 'suit = this.suit;', c: true, why: 'Backwards. This copies the field onto the parameter.' }],
      hints: ['Which side needs the name tag?'], worked: 'this.suit = suit;' } },

  { t: 'Inspect it: the testbench', level: 'faded',
    task: { kind: 'order', q: 'Assemble a testbench that checks the constructor, checks that 14 is refused, and prints the card. Some lines are decoys.',

{ id: 'forge', part: 3, n: 21, name: 'Setter Forge: a setter with this', nick: 'The Forge', blurb: 'One skill from first look to writing it alone: a setter whose parameter has the same name as its field.', skill: 'setter-this',
  steps: [
  { t: 'The mission', level: 'guided', skill: 'setter-this', stage: 'discover',
    v: () => strip('What a setter does',
      pv('1 · A product with a field', `<code class="mono">Pet p = new Pet();</code>`, 'Every Pet has a private <code>age</code> field. It starts at 0.'),
      pv('2 · Press the set button', `<code class="mono">p.setAge(3);</code>`, 'Main hands the value 3 to the setter.'),
      pv('3 · The field changed', `<code class="mono">age: 3</code>`, 'The setter stored 3 in this pet’s field. Main never touched the field itself.')),
    x: `<p>A <span class="key">method</span> is a named block of code that runs when something calls it. A <span class="key">setter</span> is a method whose only job is to change one private field. Here is the finished setter for <code>age</code>. You don't need to understand every piece yet. Step through it and watch the field.</p>
      <p>Notice that the parameter has the <b>same name</b> as the field: both are called <code>age</code>. The word <span class="key">this</span> tells Java which one you mean: <code>this.age</code> is the field inside the object, and plain <code>age</code> is the value that was handed in.</p>`,
    trace: [
      { c: 'Pet p = new Pet();', run: m => { M.decl(m, 'Pet', 'p'); M.set(m, 'p', M.build(m, 'Pet', { age: '0' })); }, note: 'A new Pet. Its age field starts at 0.' },
      { c: 'p.setAge(3);                // in main', run: m => M.decl(m, 'parameter', 'age', '3', false),
        predict: { q: 'The call starts. What appears in memory?', opts: [{ h: 'A parameter named age holding 3', ok: true, why: 'The argument 3 is copied into the parameter.' }, { h: 'A second Pet', why: 'Calling a method never builds an object. Only new does.' }, { h: 'Nothing changes yet', why: 'The parameter appears as soon as the call starts.' }] },
        note: 'A parameter named age appeared, holding 3. The field inside the Pet is still 0.' },
      { c: '   this.age = age;          // inside setAge', run: m => { M.obj(m, 'p').fields.age = '3'; },
        predict: { q: 'Which box changes now?', opts: [{ h: 'The age field inside the Pet', ok: true, why: 'this.age means the field of this object. It is on the left of =, so it changes.' }, { h: 'The age parameter', why: 'The parameter is on the right of =, so it is only read.' }] },
        note: 'this.age is the field, so the field became 3. The plain age on the right is the parameter.' },

  { t: 'Arrange the lines', level: 'guided', skill: 'setter-this', stage: 'arrange',

  { t: 'Common mistakes', level: 'faded', skill: 'setter-this', stage: 'recognize',

        { h: 'It runs, but the field never changes', ok: true, why: 'Both colors are the parameter. This is called shadowing: the parameter hides the field.' },

      { kind: 'choice', q: 'What happens with this one?', code: ['public void setColor(String color) {', '   this.color == color;', '}'], opts: [

{ id: 'plan', part: 3, n: 22, name: 'Planning classes, and main() inside a class', nick: 'The Drafting Table', blurb: 'Turn a description into classes, fields, and methods, and give a class its own main() for testing.',
  steps: [
  { t: 'Nouns and verbs', level: 'guided',
    v: () => strip('From words to a blueprint',
      pv('1 · Read the description', `<span class="mono">“A <u>library</u> lends <u>books</u>. Each book has a <u>title</u>. A member can <i>check out</i> a book.”</span>`, 'Underline the things. Circle the actions.'),
      pv('2 · Things become classes or fields', `<code class="mono">class Book<br>private String title;</code>`, 'A thing with its own details is a class. A single detail of a thing is a field.'),
      pv('3 · Actions become methods', `<code class="mono">checkOut()</code>`, 'An action something can do becomes a method of that class.')),
    x: `<p>Before writing code, decide which classes the program needs. A simple method: list the <b>nouns</b> (things) and the <b>verbs</b> (actions) in the description. A noun that has its own details, like a book, becomes a <span class="key">class</span>. A noun that is just one detail of something, like a book's title, becomes a <span class="key">field</span>. A verb becomes a <span class="key">method</span> in the class that does it.</p>`,
    words: [['class', 'a blueprint for a kind of thing that has its own data and actions'], ['field', 'one piece of data each object stores'], ['method', 'an action an object can perform']],
    rem: 'Nouns with details → classes. Single details → fields. Verbs → methods.',
    task: { kind: 'sort', q: 'A gym program: “Each <b>member</b> has a <b>name</b> and a <b>number of visits</b>. A member can <b>check in</b>. Each <b>trainer</b> has a <b>specialty</b> and can <b>schedule a session</b>.” Sort each word.', cats: ['Class', 'Field', 'Method'], doneMsg: 'Two kinds of things, each with its own details and actions.',
      items: [
        { h: 'member', cat: 0, why: 'It has its own details (a name, visits). Things with details are classes.' },
        { h: 'name', cat: 1, why: 'It is one detail about a member.' },
        { h: 'number of visits', cat: 1, why: 'It is one detail about a member.' },
        { h: 'check in', cat: 2, why: 'It is an action.' },
        { h: 'trainer', cat: 0, why: 'It has its own details (a specialty). Things with details are classes.' },
        { h: 'specialty', cat: 1, why: 'It is one detail about a trainer.' },
        { h: 'schedule a session', cat: 2, why: 'It is an action.' }] } },

  { t: 'Which class owns it?', level: 'faded',
    x: `<p>Each field and method belongs to the class it describes. A detail about a trainer goes in the Trainer class, never in the Member class.</p>`,
    task: { kind: 'quiz', qs: [
      { kind: 'choice', q: 'In the gym program, where does the field for the number of visits go?', opts: [{ h: 'In Member', ok: true, why: 'It describes a member.' }, { h: 'In Trainer', why: 'Whose visits are being counted?' }, { h: 'In main', why: 'main uses objects. The data belongs inside the class it describes.' }] },
      { kind: 'choice', q: 'A music app stores each song’s length in seconds. Is “length” a class or a field?', opts: [{ h: 'A class', why: 'Does length have details of its own?' }, { h: 'A field of Song', ok: true, why: 'It is one number describing a song.' }] },
      { kind: 'choice', q: 'Which header fits the action “a member can check in”?', opts: [{ h: 'public void checkIn() {', c: true, ok: true, why: 'An action with nothing handed back becomes a void method.' }, { h: 'private int checkIn;', c: true, why: 'That declares a field, which stores data. Actions are methods.' }, { h: 'public class CheckIn {', c: true, why: 'An action is not a kind of thing, so it isn’t its own class.' }] }] } },

  { t: 'main() inside your own class', level: 'guided',
    v: () => codeBlock(['public class Song {', '   private String title;', '', '   public void setTitle(String title) { this.title = title; }', '   public String getTitle() { return title; }', '', '   // a quick test that lives inside the class', '   public static void main(String[] args) {', '      Song s = new Song();', '      s.setTitle("Echo");', '      System.out.println(s.getTitle());', '   }', '}']),
    x: `<p>Until now, <code>main()</code> lived in its own class (the driver). Any class may also have its own <code>main()</code>. Running that class runs its main, which is handy for a quick test of the class.</p>
      <p>One catch: <code>main</code> is <span class="key">static</span>, which means it doesn't run on any particular object. So even inside Song, main has no song of its own. It must build one with <code>new</code> and use it through a variable, just like a driver would.</p>`,
    words: [['static', 'belongs to the class itself, not to any one object; main is static']],
    rem: 'A class can contain its own main. main is static, so it must create an object to use fields and methods.',
    task: { kind: 'choice', q: 'Inside Song’s main, someone writes <code>System.out.println(title);</code> What happens?', opts: [
      { h: 'It prints the title', why: 'Whose title? main isn’t running on any Song.' },
      { h: 'Compile error', ok: true, why: 'Java reports “non-static variable title cannot be referenced from a static context.” main must use an object: s.getTitle().' },
      { h: 'It prints null', why: 'It never gets to run. The compiler rejects it.' }],
      hints: ['main is static. Which object would title belong to?'] } },

    x: `<p>Write a quick test main inside a Lamp class that has <code>setColor</code> and <code>getColor</code>.</p>`,

  { t: 'Final inspection', level: 'solo',
    task: { kind: 'quiz', qs: [
      { kind: 'choice', q: 'A shop program: “Each <b>product</b> has a <b>price</b>.” What is price?', opts: [{ h: 'A field of Product', ok: true, why: 'One detail of a product.' }, { h: 'A class', why: 'It has no details of its own.' }, { h: 'A method', why: 'It is a thing, not an action.' }] },
      { kind: 'choice', q: 'Why can a class’s own main not use its fields directly?', opts: [{ h: 'main is static: there’s no object', ok: true, why: 'Fields belong to objects. main must build one first.' }, { h: 'Fields are private to the class', why: 'main is inside the class, so private is fine. The problem is that there is no object.' }, { h: 'Fields only work in setters', why: 'Any method of the class can use them, as long as there is an object.' }] },
      { kind: 'type', p: 'Inside a Gym class’s main, build a Gym named <code>gym</code>.', a: ['Gym gym = new Gym();'] }] } }
  ] },

{ id: 'compose', part: 3, n: 24, name: 'Objects inside objects', nick: 'The Subassembly', blurb: 'A field can hold another object: pass it into a constructor and let its own methods do the work.', skill: 'compose-ctor',
